<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>스트리머 배경시장 · 운석 호수</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #04060a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
  }

  #app {
    position: relative;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #04060a;
  }

  #scene {
    display: block;
    touch-action: none;
  }

  #loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #04060a;
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    letter-spacing: 0.05em;
    transition: opacity 0.6s ease;
    z-index: 20;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }

  /* 다른 배경 페이지로 이동하는 프리셋("적용") 클릭 시 - 집계 요청이 서버에
     확실히 전송된 걸 확인한 뒤에만 페이지를 넘기기 위해, 그 사이 짧은 대기를
     사용자에게 보여준다(index.html과 동일한 스타일). */
  .scene-apply-overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(13,12,11,0.85);
    backdrop-filter: blur(3px);
    color: rgba(255,255,255,0.85);
    font-size: 13px; letter-spacing: 0.05em;
    z-index: 500;
  }
  .scene-apply-overlay[hidden] { display: none; }
  .scene-apply-spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: rgba(255,170,80,0.9);
    animation: scene-apply-spin 0.8s linear infinite;
  }
  @keyframes scene-apply-spin { to { transform: rotate(360deg); } }

  #sidePanel {
    position: absolute;
    top: 50%; right: 8%;
    transform: translateY(-50%);
    width: 300px;
    max-height: 92vh;
    overflow-y: auto;
    padding: 14px;
    border-radius: 14px;
    background: rgba(20, 18, 16, 0.55);
    backdrop-filter: blur(6px);
    color: rgba(255,255,255,0.88);
    font-size: 12px;
    z-index: 10;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.3) transparent;
  }
  #sidePanel::-webkit-scrollbar { width: 6px; }
  #sidePanel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 3px; }

  #panelHandle {
    cursor: grab;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: -14px -14px 8px -14px;
    padding: 7px 0;
    border-radius: 14px 14px 0 0;
    touch-action: none;
    transition: background 0.15s ease;
  }
  #panelHandle:hover { background: rgba(255,255,255,0.06); }
  #panelHandle:active { cursor: grabbing; }
  #panelHandle .panel-grip {
    width: 32px; height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.3);
  }

  .panel-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    margin: 0 0 12px;
  }

  .panel-hint {
    font-size: 11px;
    line-height: 1.5;
    color: rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 8px 10px;
    margin: 0 0 14px;
  }

  .auth-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 10px;
  }
  #authStatus {
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #authBtn {
    flex: none;
    padding: 5px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.9);
    font-size: 11px;
    cursor: pointer;
  }
  #authBtn:hover { background: rgba(255,255,255,0.14); }
  #authBtn:disabled { opacity: 0.5; cursor: default; }

  .preset-save-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  #presetNameInput {
    flex: 1;
    min-width: 0;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.92);
    font-size: 11px;
    outline: none;
  }
  #presetNameInput::placeholder { color: rgba(255,255,255,0.4); }
  #presetNameInput:focus { border-color: rgba(232, 166, 87, 0.6); }
  #presetSaveBtn {
    flex: none;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(232, 166, 87, 0.85);
    color: #1a1410;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  #presetSaveBtn:hover { background: #e8a657; }

  .panel-divider {
    height: 1px;
    background: rgba(255,255,255,0.14);
    margin: 12px 0;
  }

  .preset-empty {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    margin: 0;
  }
  .preset-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .preset-name {
    flex: 1;
    min-width: 0;
    font-size: 11.5px;
    color: rgba(255,255,255,0.88);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: text;
  }
  .preset-btn {
    flex: none;
    padding: 4px 9px;
    border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.85);
    font-size: 10.5px;
    cursor: pointer;
  }
  .preset-btn:hover { border-color: rgba(232, 166, 87, 0.6); }
  .preset-btn--del {
    color: rgba(255,255,255,0.5);
    padding: 4px 7px;
  }
  .preset-btn--del:hover { color: #e08a6a; border-color: rgba(224, 138, 106, 0.6); }

  /* devbar - 다른 제작 게임 홍보용 상단 바, 넘칠 때만 JS가 자동 스크롤 처리 */
  .devbar {
    flex: none;
    background: #0e1116;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: relative;
    z-index: 30;
  }
  .devbar-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 7px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .devbar-label {
    font-size: 11px;
    color: rgba(255,255,255,0.72);
    letter-spacing: 0.04em;
    flex-shrink: 0;
    white-space: nowrap;
    align-self: center;
  }
  .devbar-viewport { flex: 1 1 auto; min-width: 0; overflow: hidden; }
  .devbar-track { display: flex; gap: 8px; width: max-content; }
  .devbar-track.auto-scroll { animation: devbar-scroll var(--devbar-duration, 20s) linear infinite; }
  .devbar-track.auto-scroll:hover { animation-play-state: paused; }
  @keyframes devbar-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .devbar-track.auto-scroll { animation: none; }
    .devbar-viewport { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  }
  .dev-game-link {
    flex-shrink: 0;
    white-space: nowrap;
    padding: 6px 11px;
    border-radius: 6px;
    border: none;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.85);
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.12s ease;
  }
  .dev-game-link:hover { background: rgba(255,255,255,0.18); }
</style>
</head>

  <div id="sceneApplyOverlay" class="scene-apply-overlay" hidden>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",

<script type="module">
// 운석 호수 배경 - fireworks.html처럼 최신 three.js를 ES 모듈로 불러오되, 다른 배경
// 페이지들과 달리 지형/하늘을 절차적으로 만들지 않고 사용자가 제공한 일러스트
// 이미지를 배경판(plane) 텍스처로 그대로 쓴다(요청: "이미지를 그대로 사용해도 되는데").
// 그 위에 애니메이션만 얹는다:
//   1) 운석 자체는 이미지 속 위치에 고정, 그 경로를 따라 파티클이 계속 흐르며(꼬리를
//      "예쁘게" 강조), 머리 부분은 진행 방향으로 계속 불티를 내뿜듯 펄스+이젝션.
//   2) 하단 마을·호숫가 불빛 위치에 작은 반짝임 파티클을 흩뿌려 랜덤 트윙클.
//   3) 틸트시프트 블러의 초점(r)을 화면 중앙이 아니라 운석 머리 위치로 맞춘다.
// 운석 경로 좌표는 원본 이미지(1672x941)를 픽셀 단위로 분석해 뽑아낸 값이다.
// 머리 불꽃(getFlameSprite)의 "삐죽삐죽한 다각형 + 방사형 그라디언트" 기법은
// CodePen "Meteor js Canvas"(Vo Hai Dang, MIT, https://codepen.io/haidang/pen/xWGgLd)
// 의 Rock/Meteor 렌더링 아이디어를 Three.js 캔버스 텍스처로 옮긴 것이다. 꼬리의
// 다색(시안·블루·보라·마젠타) 팔레트는 CodePen "Crystal, meteor, fire"
// (Wikyware Net, MIT, https://codepen.io/wikyware-net/pen/MWjjxdL)의 색감을
// 참고했다 — 그 펜 자체는 외부 스프라이트 시트 이미지만 애니메이션하는 순수 CSS라
// 재사용할 코드는 없었고, 색이 화려하게 섞이는 느낌만 팔레트에 반영했다.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ------------------------------------------------------------
// Firebase RTDB - 공개 프리셋 갤러리용. index.html/ski-resort.html/fireworks.html과
// 동일한 프로젝트를 그대로 공유한다. fireworks.html과 동일하게 한 모듈 스크립트
// 안이라 window 브릿지 없이 직접 참조해서 쓴다.
// ------------------------------------------------------------
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-functions.js";
import {
  getAuth, GoogleAuthProvider, signInAnonymously, signInWithPopup, signInWithCredential,
  linkWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAZcjQPHphENs-Bb7IfdL2qTtOMhJrRP54",
  authDomain: "soop-stock-market.firebaseapp.com",
  databaseURL: "https://soop-stock-market-default-rtdb.firebaseio.com",
  projectId: "soop-stock-market",
  storageBucket: "soop-stock-market.firebasestorage.app",
  messagingSenderId: "997788925900",
  appId: "1:997788925900:web:b58db2970489bf18a3a769"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const galleryRef = ref(db, 'presetGallery');

// 08번 — devbar 게임 링크를 RTDB(devbarLinks, admin-center에서 관리)에서 가져와
// 하드코딩된 링크를 대체한다. 노드가 비어있거나 조회 실패 시 기존 하드코딩된
// data-game-id 링크를 그대로 둔다(devbar가 통째로 사라지는 사고 방지) — "방송국"
// 링크는 devbarLinks 대상이 아니라 항상 하드코딩 그대로 유지된다.
(async function () {
  const SELF_GAME_ID = 'backgroundMarket';
  try {
    const snap = await get(ref(db, 'devbarLinks'));
    const data = snap.val();
    if (!data) return;
    const links = Object.keys(data)
      .filter(function (id) { return id !== SELF_GAME_ID && data[id] && data[id].url; })
      .map(function (id) { return Object.assign({ id: id }, data[id]); })
      .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    if (!links.length) return;
    const track = document.getElementById('devbarTrack');
    if (!track) return;
    track.querySelectorAll('a[data-game-id]').forEach(function (el) { el.remove(); });
    links.forEach(function (link) {
      const a = document.createElement('a');
      a.className = 'dev-game-link';
      a.dataset.gameId = link.id;
      a.href = link.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = link.label;
      track.appendChild(a);
    });
    window.dispatchEvent(new Event('resize')); // 마퀴 재계산 트리거
  } catch (e) {
    console.error('devbar 링크 갱신 실패(기존 링크 유지):', e);
  }
})();
const functions = getFunctions(fbApp, 'us-central1');
const publishPresetFn = httpsCallable(functions, 'publishPreset');
const updatePresetFn = httpsCallable(functions, 'updatePreset');
const deletePresetFn = httpsCallable(functions, 'deletePreset');
const requestMergeTicketFn = httpsCallable(functions, 'requestPresetMergeTicket');
const claimMergeFn = httpsCallable(functions, 'claimPresetMerge');
const reportMergeFailureFn = httpsCallable(functions, 'reportPresetMergeFailure');
// 통합 관리 센터에서 배경시장 갤러리 통계(적용/OBS 링크 횟수)를 보여주기 위한
// 집계용 - 클릭한 사람에게 결과를 보여줄 필요가 없어 실패해도 조용히 무시한다
// (통계 갱신 실패로 실제 적용·복사 동작 자체를 막으면 안 됨). 새 배경 페이지를
// 만들 때 이 호출을 빠뜨리면 안 된다는 게 CLAUDE.md에 명시된 규칙이라 처음부터 넣는다.
const incrementPresetApplyCountFn = httpsCallable(functions, 'incrementPresetApplyCount');
const incrementPresetObsLinkCountFn = httpsCallable(functions, 'incrementPresetObsLinkCount');
// 09번/13번 — UI에서 게시/삭제 버튼을 보여줄지 판단하는 용도일 뿐(실제 권한은
// 항상 서버가 검증). adminCenter/adminUids는 .read:false라 클라이언트가 직접 못
// 읽으므로 whoAmI로 확인한 결과를 캐싱해서 쓴다.
const whoAmIFn = httpsCallable(functions, 'galleryWhoAmI');
let isAdminCached = false;
const auth = getAuth(fbApp);

let currentUser = null;
const firebaseAuthApi = {
  isRealAccount: function () { return !!(currentUser && !currentUser.isAnonymous); },
  isAdmin: function () { return isAdminCached; },
  signIn: function () {
    const provider = new GoogleAuthProvider();
    function handleFail(err) {
      if (err && (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request')) return;
      console.error('Google 로그인 실패:', err);
      window.alert('Google 로그인에 실패했습니다. 잠시 후 다시 시도해주세요.');
    }
    const oldUidBeforeSwitch = currentUser ? currentUser.uid : null;
    function linkOrSwitch(ticket) {
      return linkWithPopup(currentUser, provider).catch(function (err) {
        if (err && (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request')) return;
        if (err && err.code === 'auth/credential-already-in-use') {
          const cred = GoogleAuthProvider.credentialFromError(err);
          if (cred) {
            return signInWithCredential(auth, cred).then(function () {
              if (!ticket) {
                return reportMergeFailureFn({ oldUidHint: oldUidBeforeSwitch, reason: 'no-ticket' }).catch(function (reportErr) {
                  console.error('실패 로그 기록도 실패함:', reportErr);
                });
              }
              return claimMergeFn({ ticket: ticket }).catch(function (claimErr) {
                console.error('프리셋 소유권 이전 실패 (서버에 실패 로그가 남았을 수 있음):', claimErr);
              });
            }).catch(handleFail);
          }
        }
        handleFail(err);
      });
    }
    if (currentUser && currentUser.isAnonymous) {
      return requestMergeTicketFn().then(function (res) {
        return linkOrSwitch(res.data && res.data.ticket);
      }).catch(function (err) {
        console.error('병합 티켓 발급 실패, 티켓 없이 로그인 진행:', err);
        return linkOrSwitch(null);
      });
    }
    return signInWithPopup(auth, provider).catch(handleFail);
  },
  signOut: function () { return signOut(auth); }
};

// ------------------------------------------------------------
// 기본 설정 - 방송 송출용 고정 16:9 (다른 배경 페이지들과 동일한 규칙). 카메라는
// 원점에 두고 기본 방향(-Z를 바라봄)을 그대로 쓴다 - 배경판이 카메라 정면에
// 평평하게 있을 뿐이라 lookAt으로 각도를 줄 필요가 없다.
// ------------------------------------------------------------
const FIXED_ASPECT = 16 / 9;
const FIXED_FOV = 50;

const canvas = document.getElementById('scene');
const loadingEl = document.getElementById('loading');
const sidePanel = document.getElementById('sidePanel');
const panelHandle = document.getElementById('panelHandle');
const appEl = document.getElementById('app');

// ------------------------------------------------------------
// 후보정 셰이더 - 비네트 + 필름 그레인. 다른 배경 페이지들과 동일.
// ------------------------------------------------------------
const VignetteShader = {
  uniforms: { tDiffuse: { value: null }, darkness: { value: 1.1 } },
  vertexShader:
    'varying vec2 vUv;' +
    'void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader:
    'precision mediump float;' +
    'uniform sampler2D tDiffuse; uniform float darkness; varying vec2 vUv;' +
    'void main() {' +
    '  vec4 texel = texture2D(tDiffuse, vUv);' +
    '  vec2 uv = vUv - 0.5;' +
    '  float vig = 1.0 - dot(uv, uv) * darkness;' +
    '  gl_FragColor = vec4(texel.rgb * clamp(vig, 0.0, 1.0), texel.a);' +
    '}'
};
const FilmGrainShader = {
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uAmount: { value: 0.02 } },
  vertexShader:
    'varying vec2 vUv;' +
    'void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader:
    'precision mediump float;' +
    'uniform sampler2D tDiffuse; uniform float uTime; uniform float uAmount; varying vec2 vUv;' +
    'float grainRand(vec2 co) { return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453); }' +
    'void main() {' +
    '  vec4 texel = texture2D(tDiffuse, vUv);' +
    '  float n = (grainRand(vUv * 1000.0 + uTime) - 0.5) * uAmount;' +
    '  gl_FragColor = vec4(texel.rgb + n, texel.a);' +
    '}'
};

const FILM_GRAIN_AMOUNT = 0.02;

// ------------------------------------------------------------
// 발광 스프라이트 - 파티클(운석 꼬리 흐름·불티·마을 반짝임)에 공통으로 쓰는
// 부드러운 가우시안 코어 텍스처 하나면 충분하다(firework-scene.js 계열과 동일 기법).
// ------------------------------------------------------------
const GRADIENT_STEPS = 32;
function fillGaussianRadial(ctx, cx, cy, r, curve) {
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  for (let i = 0; i <= GRADIENT_STEPS; i++) {
    const t = i / GRADIENT_STEPS;
    const a = Math.max(0, Math.min(1, curve(t)));
    grad.addColorStop(t, 'rgba(255,255,255,' + a.toFixed(4) + ')');
  }
  return grad;
}
function getSprite() {
  const size = 128, cx = size / 2, cy = size / 2, r = size / 2;
  const cvs = document.createElement('canvas');
  cvs.width = size; cvs.height = size;
  const ctx = cvs.getContext('2d');
  ctx.fillStyle = fillGaussianRadial(ctx, cx, cy, r, function (t) {
    // t=1(반지름 끝)에서 정확히 0으로 떨어뜨려야 한다 - 아주 살짝이라도 남으면
    // fillRect가 반지름 바깥 네 모서리까지 그 마지막 색으로 "연장"해서 칠해버려,
    // 스프라이트를 크게 확대했을 때(예: 앰비언트 플레어 글로우) 흐릿한 사각형
    // 테두리가 비쳐 보이는 버그가 있었다.
    if (t >= 0.999) return 0;
    return Math.exp(-t * t * 7.0) + 0.55 * Math.exp(-t * t * 2.2);
  });
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(cvs);
}

// 운석 머리 불꽃 - 매끈한 원형 대신, 흔들리는 불꽃/크리스탈처럼 보이도록 각 점의
// 반지름을 무작위로 흩트린 삐죽삐죽한 다각형에 따뜻한 방사형 그라디언트를 채운다
// (CodePen "Meteor js Canvas", Vo Hai Dang, MIT — 삐죽삐죽한 폴리곤으로 불티/암석
// 덩어리를 표현하는 기법을 그대로 가져오되, 여기선 파티클이 아니라 스프라이트
// 텍스처 하나로 굽는다). seed가 다른 텍스처 여러 장을 만들어 회전시키면 매 프레임
// 다시 그리지 않고도 살아있는 듯한 불꽃 흔들림을 흉내낼 수 있다.
function getFlameSprite(seed) {
  const size = 160, cx = size / 2, cy = size / 2;
  const cvs = document.createElement('canvas');
  cvs.width = size; cvs.height = size;
  const ctx = cvs.getContext('2d');
  let s = seed;
  function rand() { s = (s * 9301 + 49297) % 233280; return s / 233280; }
  const points = 14;
  const path = [];
  for (let i = 0; i < points; i++) {
    const angle = (i / points) * Math.PI * 2;
    const jag = 0.5 + rand() * 0.65;
    // 세로로 조금 늘려서 위로 치솟는 불꽃 실루엣에 가깝게
    path.push([cx + Math.cos(angle) * size * 0.34 * jag, cy + Math.sin(angle) * size * 0.4 * jag]);
  }
  ctx.beginPath();
  path.forEach(function (p, i) { i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]); });
  ctx.closePath();
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 0.5);
  grad.addColorStop(0, 'rgba(255,255,240,1)');
  grad.addColorStop(0.3, 'rgba(255,214,130,0.95)');
  grad.addColorStop(0.62, 'rgba(255,130,70,0.6)');
  grad.addColorStop(1, 'rgba(255,60,50,0)');
  ctx.fillStyle = grad;
  ctx.fill();
  const tex = new THREE.CanvasTexture(cvs);
  tex.anisotropy = 4;
  return tex;
}

// ------------------------------------------------------------
// 씬 / 카메라 / 렌더러 - 카메라는 원점 고정, 배경판만 정면에 둔다.
// ------------------------------------------------------------
const glowSprite = getSprite();
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(FIXED_FOV, FIXED_ASPECT, 0.1, 3000);

const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// ------------------------------------------------------------
// 배경판 - 사용자가 제공한 일러스트(1672x941, 16:9)를 카메라 시야를 정확히 채우는
// 평면에 텍스처로 입힌다. 카메라 aspect/FOV가 고정이라 이 평면 크기는 창 크기와
// 무관하게 항상 화면을 꽉 채운다(letterbox는 fitCanvas()의 CSS 크기 조정만으로 처리).
// ------------------------------------------------------------
const IMG_W = 1672, IMG_H = 941;
const BACKDROP_DIST = 300;
const backdropHeight = 2 * BACKDROP_DIST * Math.tan(THREE.MathUtils.degToRad(FIXED_FOV) / 2);
const backdropWidth = backdropHeight * FIXED_ASPECT;

const textureLoader = new THREE.TextureLoader();
const backdropTex = textureLoader.load('textures/backdrops/comet-lake.jpg', function () {
  loadingEl.classList.add('hidden');
}, undefined, function (err) {
  console.error('배경 이미지 로드 실패:', err);
  loadingEl.textContent = '배경 이미지를 불러오지 못했습니다.';
});
backdropTex.colorSpace = THREE.SRGBColorSpace;
const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(backdropWidth, backdropHeight),
  new THREE.MeshBasicMaterial({ map: backdropTex })
);
backdrop.position.set(0, 0, -BACKDROP_DIST);
scene.add(backdrop);

// 이미지 픽셀 좌표(px, py) → 배경판 위 월드 좌표. zOffset만큼 배경판보다 카메라
// 쪽으로 앞당겨서 겹쳐 그려도 오버레이가 항상 위에 보이게 한다(depthTest 끌 필요 없음).
function imgToWorld(px, py, zOffset) {
  return new THREE.Vector3(
    (px / IMG_W - 0.5) * backdropWidth,
    (0.5 - py / IMG_H) * backdropHeight,
    -BACKDROP_DIST + zOffset
  );
}

// ------------------------------------------------------------
// 운석 - 이미지 속 실제 위치는 고정한 채, 그 경로를 따라 파티클이 계속 흐르게 해서
// "제자리에서 흐르는" 느낌을 준다. 경로 좌표는 원본 이미지를 픽셀 단위로 분석해
// (파랑 채널이 우세하고 밝은 픽셀의 가로 밴드별 중심) 뽑아낸 값 - 꼬리 끝(우상단)에서
// 머리(호수 위 밝은 점)까지 10구간.
// ------------------------------------------------------------
const COMET_PATH_PX = [
  [1170, 0], [1074, 25], [1026, 75], [979, 125], [919, 175],
  [879, 225], [843, 275], [800, 325], [796, 375], [785, 425], [735, 437]
];
const COMET_HEAD_PX = COMET_PATH_PX[COMET_PATH_PX.length - 1];
// 틸트시프트 초점을 화면 중앙(0.5)이 아니라 운석 머리 위치로 맞춘다. EffectComposer의
// 풀스크린 쿼드는 vUv.y=0이 화면 아래쪽이라, 이미지 위쪽 기준 비율(0=위)을 뒤집어서 넣는다.
const TILT_SHIFT_FOCUS_R = 1 - (COMET_HEAD_PX[1] / IMG_H);

const cometPathWorld = COMET_PATH_PX.map(function (p) { return imgToWorld(p[0], p[1], 0.6); });
const cometSegLengths = [];
let cometTotalLen = 0;
for (let i = 0; i < cometPathWorld.length - 1; i++) {
  const d = cometPathWorld[i].distanceTo(cometPathWorld[i + 1]);
  cometSegLengths.push(d);
  cometTotalLen += d;
}
function pointOnCometPath(t) {
  t = THREE.MathUtils.clamp(t, 0, 1);
  let dist = t * cometTotalLen;
  for (let i = 0; i < cometSegLengths.length; i++) {
    const segLen = cometSegLengths[i];
    if (dist <= segLen || i === cometSegLengths.length - 1) {
      const segT = segLen > 0 ? THREE.MathUtils.clamp(dist / segLen, 0, 1) : 0;
      return new THREE.Vector3().lerpVectors(cometPathWorld[i], cometPathWorld[i + 1], segT);
    }
    dist -= segLen;
  }
  return cometPathWorld[cometPathWorld.length - 1].clone();
}

// 꼬리를 따라 흐르는 파티클 - 각자 0~1 진행도(t)를 갖고 tail→head로 계속 나아가다
// 머리에 닿으면 다시 꼬리 쪽으로 되돌아가 반복한다(위치는 고정, 흐름만 반복).
// 꼬리 색 팔레트 - 단조로운 3색 그라디언트 대신, 원본 일러스트의 시안/블루/보라/
// 마젠타가 뒤섞인 느낌을 살리려고 5개 색상 정지점을 쓰고, 일부 파티클은 아예
// 마젠타 계열로 튀게 해서 "다양한 색 표현"을 낸다("Crystal, meteor, fire" 참고 -
// 그 펜 자체는 외부 스프라이트 시트라 코드를 그대로 가져올 게 없어서, 색감이
// 화려하게 섞이는 느낌만 참고해 여기 파티클 팔레트에 반영했다).
const COMET_FLOW_COUNT = 320;
const cometFlowGeo = new THREE.BufferGeometry();
const cometFlowPos = new Float32Array(COMET_FLOW_COUNT * 3);
const cometFlowColor = new Float32Array(COMET_FLOW_COUNT * 3);
const cometFlowT = new Float32Array(COMET_FLOW_COUNT);
const cometFlowSpeed = new Float32Array(COMET_FLOW_COUNT);
const cometFlowPhase = new Float32Array(COMET_FLOW_COUNT);
const cometFlowMagenta = new Uint8Array(COMET_FLOW_COUNT);
const TAIL_PALETTE = [
  new THREE.Color(0x2f6fe0), // 짙은 인디고
  new THREE.Color(0x4fb8f0), // 시안 블루
  new THREE.Color(0x8fd8ff), // 밝은 하늘색
  new THREE.Color(0xd6b3ff), // 연보라
  new THREE.Color(0xfff2e0)  // 머리 근처 흰빛
];
const TAIL_MAGENTA = new THREE.Color(0xff6ad5); // 마젠타 악센트(일부 파티클만)
for (let i = 0; i < COMET_FLOW_COUNT; i++) {
  cometFlowT[i] = Math.random();
  cometFlowSpeed[i] = 0.05 + Math.random() * 0.05;
  cometFlowPhase[i] = Math.random() * Math.PI * 2;
  cometFlowMagenta[i] = Math.random() < 0.16 ? 1 : 0; // 16%는 마젠타 악센트로 튀게
}
cometFlowGeo.setAttribute('position', new THREE.BufferAttribute(cometFlowPos, 3));
cometFlowGeo.setAttribute('color', new THREE.BufferAttribute(cometFlowColor, 3));
const cometFlowMat = new THREE.PointsMaterial({
  size: 4, map: glowSprite, vertexColors: true,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
const cometFlowPoints = new THREE.Points(cometFlowGeo, cometFlowMat);
scene.add(cometFlowPoints);

function tailColorAt(t) {
  const scaled = THREE.MathUtils.clamp(t, 0, 1) * (TAIL_PALETTE.length - 1);
  const idx = Math.min(TAIL_PALETTE.length - 2, Math.floor(scaled));
  return TAIL_PALETTE[idx].clone().lerp(TAIL_PALETTE[idx + 1], scaled - idx);
}
const cometFlowScratchColor = new THREE.Color();
function updateCometFlow(dt, time) {
  const posAttr = cometFlowGeo.attributes.position;
  const colorAttr = cometFlowGeo.attributes.color;
  for (let i = 0; i < COMET_FLOW_COUNT; i++) {
    cometFlowT[i] += cometFlowSpeed[i] * dt;
    if (cometFlowT[i] > 1) {
      cometFlowT[i] -= 1;
      cometFlowSpeed[i] = 0.05 + Math.random() * 0.05;
      cometFlowMagenta[i] = Math.random() < 0.16 ? 1 : 0;
    }
    const t = cometFlowT[i];
    const p = pointOnCometPath(t);
    posAttr.setXYZ(i, p.x, p.y, p.z);
    // 양 끝은 옅게 페이드, 가운데는 또렷하게 + 반짝이는 셔머(개별 위상의 사인파)
    const edgeFade = Math.min(1, t * 5) * Math.min(1, (1 - t) * 5 + 0.15);
    const shimmer = 0.75 + Math.sin(time * 2.4 + cometFlowPhase[i]) * 0.25;
    cometFlowScratchColor.copy(cometFlowMagenta[i] ? TAIL_MAGENTA : tailColorAt(t));
    cometFlowScratchColor.multiplyScalar(edgeFade * shimmer);
    colorAttr.setXYZ(i, cometFlowScratchColor.r, cometFlowScratchColor.g, cometFlowScratchColor.b);
  }
  posAttr.needsUpdate = true;
  colorAttr.needsUpdate = true;
}

// 머리 - 진행 방향(직전 지점→머리)으로 계속 불티를 뿜어내는 이젝션 파티클 +
// 맥동하는 코어 글로우로 "불꽃을 뿜으며" 있는 느낌을 준다.
const headWorld = imgToWorld(COMET_HEAD_PX[0], COMET_HEAD_PX[1], 0.8);
const preHeadWorld = cometPathWorld[cometPathWorld.length - 2];
const emberDir = new THREE.Vector3().subVectors(headWorld, preHeadWorld).normalize();

// 이젝션 파티클 두 겹 - 크고 느린 "불티"(ember)와 작고 빠른 "스파크"를 같이 뿜어서
// 밀도감을 준다(단일 레이어일 때보다 훨씬 덜 밋밋하다).
function makeEjectionLayer(count, opts) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const color = new Float32Array(count * 3);
  const vel = new Float32Array(count * 3);
  const life = new Float32Array(count);
  function reset(i) {
    const i3 = i * 3;
    pos[i3] = headWorld.x; pos[i3 + 1] = headWorld.y; pos[i3 + 2] = headWorld.z;
    const speed = opts.speedMin + Math.random() * opts.speedRange;
    vel[i3] = emberDir.x * speed + (Math.random() - 0.5) * opts.spread;
    vel[i3 + 1] = emberDir.y * speed + (Math.random() - 0.5) * opts.spread;
    vel[i3 + 2] = emberDir.z * speed + (Math.random() - 0.5) * opts.spread * 0.3;
    life[i] = 0;
  }
  for (let i = 0; i < count; i++) { reset(i); life[i] = Math.random(); }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(color, 3));
  const mat = new THREE.PointsMaterial({
    size: opts.size, map: glowSprite, vertexColors: true,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  const points = new THREE.Points(geo, mat);
  scene.add(points);
  const scratch = new THREE.Color();
  function update(dt) {
    const posAttr = geo.attributes.position;
    const colorAttr = geo.attributes.color;
    for (let i = 0; i < count; i++) {
      life[i] += dt * opts.fadeSpeed;
      if (life[i] > 1) reset(i);
      const i3 = i * 3;
      pos[i3] += vel[i3] * dt;
      pos[i3 + 1] += vel[i3 + 1] * dt;
      pos[i3 + 2] += vel[i3 + 2] * dt;
      posAttr.setXYZ(i, pos[i3], pos[i3 + 1], pos[i3 + 2]);
      const fade = 1 - life[i];
      scratch.copy(opts.colorStart).lerp(opts.colorEnd, life[i]).multiplyScalar(fade);
      colorAttr.setXYZ(i, scratch.r, scratch.g, scratch.b);
    }
    posAttr.needsUpdate = true;
    colorAttr.needsUpdate = true;
  }
  return update;
}
const updateEmbersBig = makeEjectionLayer(70, {
  size: 3.6, speedMin: 1.6, speedRange: 1.8, spread: 0.5, fadeSpeed: 0.7,
  colorStart: new THREE.Color(0xffd9a0), colorEnd: new THREE.Color(0xff6a3d)
});
const updateEmbersSpark = makeEjectionLayer(90, {
  size: 1.6, speedMin: 3.2, speedRange: 3.4, spread: 0.9, fadeSpeed: 1.6,
  colorStart: new THREE.Color(0xffffff), colorEnd: new THREE.Color(0xffe6a8)
});
function updateEmbers(dt) {
  updateEmbersBig(dt);
  updateEmbersSpark(dt);
}

// 운석 머리 - 삐죽삐죽한 불꽃 스프라이트 3장을 서로 다른 속도로 회전·맥동시켜서
// (매 프레임 다시 그리지 않고도) 흔들리는 불꽃처럼 보이게 하고, 그 뒤에 큰 앰비언트
// 광원(LightFlare 기법 — 부드러운 방사형 그라디언트 한 장)을 깔아 은은하게 밝힌다.
const flameTextures = [11, 47, 93].map(getFlameSprite);
const flameSprites = flameTextures.map(function (tex, idx) {
  const mat = new THREE.SpriteMaterial({
    map: tex, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, opacity: 0.8
  });
  const spr = new THREE.Sprite(mat);
  spr.position.copy(headWorld);
  spr.position.z += 0.05 * (idx + 1); // 살짝씩 다른 깊이로 어긋나게 둬서 여러 장 겹친 느낌
  scene.add(spr);
  return { sprite: spr, mat: mat, phase: idx * 2.1, rotSpeed: 0.35 + idx * 0.22, baseScale: 12 - idx * 1.4 };
});
const flareGlowMat = new THREE.SpriteMaterial({
  map: glowSprite, color: 0xffe9c2, transparent: true,
  depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.4
});
const flareGlow = new THREE.Sprite(flareGlowMat);
flareGlow.position.copy(headWorld);
flareGlow.scale.set(42, 42, 1);
scene.add(flareGlow);

function updateHeadGlow(t) {
  flameSprites.forEach(function (f) {
    const pulse = 0.82 + Math.sin(t * 2.6 + f.phase) * 0.16 + Math.sin(t * 5.3 + f.phase * 1.7) * 0.08;
    const scale = f.baseScale * pulse;
    f.sprite.scale.set(scale, scale, 1);
    f.mat.rotation = t * f.rotSpeed + f.phase;
    f.mat.opacity = 0.55 + Math.sin(t * 3.1 + f.phase * 0.6) * 0.2;
  });
  const flarePulse = 1 + Math.sin(t * 1.7) * 0.08;
  flareGlow.scale.set(42 * flarePulse, 42 * flarePulse, 1);
  flareGlowMat.opacity = 0.32 + Math.sin(t * 1.7 + 0.6) * 0.08;
}

// ------------------------------------------------------------
// 마을 불빛 반짝임 - 정확한 창문 좌표를 맞추는 대신, 이미지 하단(호숫가 마을) 영역에
// 적당히 흩뿌리고 각자 다른 속도/위상으로 반짝이게 한다. 덧그리는 additive 오버레이라
// 그림 속 불빛과 완벽히 겹치지 않아도 "불빛이 살아있는" 느낌을 자연스럽게 더해준다.
// ------------------------------------------------------------
const TWINKLE_COUNT = 140;
const twinkleGeo = new THREE.BufferGeometry();
const twinklePos = new Float32Array(TWINKLE_COUNT * 3);
const twinkleColor = new Float32Array(TWINKLE_COUNT * 3);
const twinklePhase = new Float32Array(TWINKLE_COUNT);
const twinkleSpeed = new Float32Array(TWINKLE_COUNT);
const twinkleBase = new Float32Array(TWINKLE_COUNT);
const twinkleIsWarm = new Uint8Array(TWINKLE_COUNT);
for (let i = 0; i < TWINKLE_COUNT; i++) {
  const side = Math.random();
  let u;
  if (side < 0.42) u = Math.random() * 0.32;
  else if (side < 0.84) u = 0.68 + Math.random() * 0.32;
  else u = 0.32 + Math.random() * 0.36;
  const v = 0.60 + Math.random() * 0.37;
  const w = imgToWorld(u * IMG_W, v * IMG_H, 0.4);
  twinklePos[i * 3] = w.x; twinklePos[i * 3 + 1] = w.y; twinklePos[i * 3 + 2] = w.z;
  twinklePhase[i] = Math.random() * Math.PI * 2;
  twinkleSpeed[i] = 1.2 + Math.random() * 2.2;
  twinkleBase[i] = 0.35 + Math.random() * 0.4;
  twinkleIsWarm[i] = Math.random() < 0.75 ? 1 : 0;
}
twinkleGeo.setAttribute('position', new THREE.BufferAttribute(twinklePos, 3));
twinkleGeo.setAttribute('color', new THREE.BufferAttribute(twinkleColor, 3));
const twinkleWarmColor = new THREE.Color(0xffdca0);
const twinkleCoolColor = new THREE.Color(0xcfe8ff);
const twinkleMat = new THREE.PointsMaterial({
  size: 4, map: glowSprite, vertexColors: true,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
const twinklePoints = new THREE.Points(twinkleGeo, twinkleMat);
scene.add(twinklePoints);

function updateTwinkle(t) {
  const colorAttr = twinkleGeo.attributes.color;
  for (let i = 0; i < TWINKLE_COUNT; i++) {
    const s = Math.sin(t * twinkleSpeed[i] + twinklePhase[i]) * 0.5 + 0.5;
    const alpha = twinkleBase[i] * (0.35 + s * 0.9);
    const col = twinkleIsWarm[i] ? twinkleWarmColor : twinkleCoolColor;
    colorAttr.setXYZ(i, col.r * alpha, col.g * alpha, col.b * alpha);
  }
  colorAttr.needsUpdate = true;
}

// ------------------------------------------------------------
// 후처리 - RenderPass + 블룸 + 틸트시프트(초점=운석 머리) + 비네트 + 필름그레인.
// ------------------------------------------------------------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// threshold를 낮게 두면 일몰 하늘의 넓은 주황빛 그라디언트까지 전부 블룸에 걸려
// 화면 전체가 뿌옇게 뜬다 - 운석·마을 불빛처럼 정말 밝은 점광원만 블룸이 걸리게
// 문턱값을 올렸다(CLAUDE.md 후처리 규칙 참고).
const bloomPass = new UnrealBloomPass(new THREE.Vector2(1280, 720), 0.55, 0.45, 0.55);
composer.addPass(bloomPass);

// 틸트시프트 블러 - 실제 3D 깊이 대신 화면 세로 좌표만으로 블러 세기를 정하는 방식
// (ski-resort.html/fireworks.html에서 이미 검증된 기법). 다른 페이지들은 초점을
// 화면 중앙(0.5)에 두지만, 이 씬은 운석 머리(TILT_SHIFT_FOCUS_R) 쪽에 초점을 두고
// 그 위아래(하늘 원경·호수 쪽)를 부드럽게 흐린다.
const TiltShiftShader = {
  uniforms: { tDiffuse: { value: null }, h: { value: 1 / 512 }, v: { value: 1 / 512 }, r: { value: 0.5 } },
  vertexShader:
    'varying vec2 vUv;' +
    'void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShaderH:
    'uniform sampler2D tDiffuse; uniform float h; uniform float r; varying vec2 vUv;' +
    'void main() {' +
    '  vec4 sum = vec4(0.0);' +
    '  float hh = h * abs(r - vUv.y);' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x - 4.0*hh, vUv.y)) * 0.051;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x - 3.0*hh, vUv.y)) * 0.0918;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x - 2.0*hh, vUv.y)) * 0.12245;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x - 1.0*hh, vUv.y)) * 0.1531;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y)) * 0.1633;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x + 1.0*hh, vUv.y)) * 0.1531;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x + 2.0*hh, vUv.y)) * 0.12245;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x + 3.0*hh, vUv.y)) * 0.0918;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x + 4.0*hh, vUv.y)) * 0.051;' +
    '  gl_FragColor = sum;' +
    '}',
  fragmentShaderV:
    'uniform sampler2D tDiffuse; uniform float v; uniform float r; varying vec2 vUv;' +
    'void main() {' +
    '  vec4 sum = vec4(0.0);' +
    '  float vv = v * abs(r - vUv.y);' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y - 4.0*vv)) * 0.051;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y - 3.0*vv)) * 0.0918;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y - 2.0*vv)) * 0.12245;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y - 1.0*vv)) * 0.1531;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y)) * 0.1633;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y + 1.0*vv)) * 0.1531;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y + 2.0*vv)) * 0.12245;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y + 3.0*vv)) * 0.0918;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y + 4.0*vv)) * 0.051;' +
    '  gl_FragColor = sum;' +
    '}'
};
const hBlur = new ShaderPass({
  uniforms: THREE.UniformsUtils.clone(TiltShiftShader.uniforms),
  vertexShader: TiltShiftShader.vertexShader,
  fragmentShader: TiltShiftShader.fragmentShaderH
});
const vBlur = new ShaderPass({
  uniforms: THREE.UniformsUtils.clone(TiltShiftShader.uniforms),
  vertexShader: TiltShiftShader.vertexShader,
  fragmentShader: TiltShiftShader.fragmentShaderV
});
const TILT_SHIFT_BLURINESS = 4.2;
hBlur.uniforms.h.value = TILT_SHIFT_BLURINESS / 1280;
vBlur.uniforms.v.value = TILT_SHIFT_BLURINESS / 720;
hBlur.uniforms.r.value = vBlur.uniforms.r.value = TILT_SHIFT_FOCUS_R;
composer.addPass(hBlur);
composer.addPass(vBlur);

const vignettePass = new ShaderPass(VignetteShader);
composer.addPass(vignettePass);
const filmGrainPass = new ShaderPass(FilmGrainShader);
filmGrainPass.uniforms.uAmount.value = FILM_GRAIN_AMOUNT;
filmGrainPass.enabled = false; // 필름 그레인(노이즈) 효과 끔 - 다시 켜려면 이 줄만 지우면 됨
composer.addPass(filmGrainPass);
composer.addPass(new OutputPass());

// ------------------------------------------------------------
// 프리셋 - 이 페이지는 조정 가능한 설정이 없어서, "저장"은 이 배경 페이지로
// 연결되는 링크(sceneUrl)를 이름 붙여 즐겨찾기해두는 것과 같다. index.html/
// ski-resort.html/fireworks.html의 프리셋과 로컬 저장소를 공유한다.
// ------------------------------------------------------------
const PRESETS_KEY = 'interior3dViewer.presets';
let presets = {};
try {
  presets = JSON.parse(localStorage.getItem(PRESETS_KEY)) || {};
} catch (e) { presets = {}; }

function getCurrentConfig() {
  return { sceneUrl: 'meteor-lake.html' };
}
function encodePreset(cfg) {
  return btoa(unescape(encodeURIComponent(JSON.stringify(cfg))));
}
function applyConfig(cfg) {
  if (cfg.sceneUrl) {
    window.location.href = cfg.sceneUrl;
    return;
  }
  window.location.href = 'index.html?preset=' + encodePreset(cfg);
}
function savePresetsToStorage() {
  localStorage.setItem(PRESETS_KEY, JSON.stringify(presets));
}
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function (resolve, reject) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      resolve();
    } catch (e) { reject(e); }
  });
}

let isAdminForGallery = false;

function renderPresetList() {
  const root = document.getElementById('presetList');
  root.innerHTML = '';
  const names = Object.keys(presets);
  if (names.length === 0) {
    const empty = document.createElement('p');
    empty.className = 'preset-empty';
    empty.textContent = '저장된 프리셋이 없습니다';
    root.appendChild(empty);
    return;
  }
  names.forEach(function (name) {
    const row = document.createElement('div');
    row.className = 'preset-row';

    const label = document.createElement('span');
    label.className = 'preset-name';
    label.textContent = name;
    label.title = name + ' (더블클릭하여 이름 변경)';
    label.addEventListener('dblclick', function () {
      const newName = window.prompt('새 이름을 입력하세요:', name);
      if (newName === null) return;
      const trimmed = newName.trim();
      if (!trimmed || trimmed === name) return;
      if (presets[trimmed] && !window.confirm('"' + trimmed + '" 이름이 이미 있습니다. 덮어쓸까요?')) return;
      const cfg = presets[name];
      delete presets[name];
      presets[trimmed] = cfg;
      savePresetsToStorage();
      renderPresetList();
    });
    row.appendChild(label);

    const applyBtn = document.createElement('button');
    applyBtn.className = 'preset-btn';
    applyBtn.type = 'button';
    applyBtn.textContent = '적용';
    applyBtn.addEventListener('click', function () { applyConfig(presets[name]); });
    row.appendChild(applyBtn);

    const shareBtn = document.createElement('button');
    shareBtn.className = 'preset-btn';
    shareBtn.type = 'button';
    shareBtn.textContent = '공유';
    shareBtn.title = '이 프리셋의 공유 링크를 클립보드에 복사';
    shareBtn.addEventListener('click', function () {
      const url = location.origin + location.pathname.replace(/[^/]*$/, '') + 'index.html?preset=' + encodePreset(presets[name]);
      copyToClipboard(url).then(function () {
        shareBtn.textContent = '복사됨!';
        setTimeout(function () { shareBtn.textContent = '공유'; }, 1500);
      }).catch(function () {
        window.prompt('아래 URL을 복사하세요:', url);
      });
    });
    row.appendChild(shareBtn);

    const obsBtn = document.createElement('button');
    obsBtn.className = 'preset-btn';
    obsBtn.type = 'button';
    obsBtn.textContent = 'OBS';
    obsBtn.title = 'OBS 브라우저 소스용 링크 복사 - 추가하자마자 패널·상단바 없이 꽉 찬 화면으로 시작';
    obsBtn.addEventListener('click', function () {
      const dir = location.pathname.replace(/[^/]*$/, '');
      const url = presets[name].sceneUrl
        ? location.origin + dir + presets[name].sceneUrl + '?obs=1'
        : location.origin + dir + 'index.html?preset=' + encodePreset(presets[name]) + '&obs=1';
      copyToClipboard(url).then(function () {
        obsBtn.textContent = '복사됨!';
        setTimeout(function () { obsBtn.textContent = 'OBS'; }, 1500);
      }).catch(function () {
        window.prompt('아래 URL을 복사하세요:', url);
      });
    });
    row.appendChild(obsBtn);

    if (isAdminForGallery) {
      const publishBtn = document.createElement('button');
      publishBtn.className = 'preset-btn';
      publishBtn.type = 'button';
      publishBtn.textContent = '게시';
      publishBtn.title = '모두가 볼 수 있는 공개 갤러리에 올리기';
      publishBtn.addEventListener('click', function () {
        publishPresetFn({ name: name, config: presets[name] }).then(function () {
          publishBtn.textContent = '게시됨!';
          setTimeout(function () { publishBtn.textContent = '게시'; }, 1500);
        }).catch(function (err) {
          console.error('갤러리 게시 실패:', err);
          window.alert('갤러리 게시에 실패했습니다. 잠시 후 다시 시도해주세요.');
        });
      });
      row.appendChild(publishBtn);
    }

    const delBtn = document.createElement('button');
    delBtn.className = 'preset-btn preset-btn--del';
    delBtn.type = 'button';
    delBtn.textContent = '✕';
    delBtn.title = '삭제';
    delBtn.addEventListener('click', function () {
      delete presets[name];
      savePresetsToStorage();
      renderPresetList();
    });
    row.appendChild(delBtn);

    root.appendChild(row);
  });
}

document.getElementById('presetSaveBtn').addEventListener('click', function () {
  const input = document.getElementById('presetNameInput');
  let name = input.value.trim();
  if (!name) name = '프리셋 ' + (Object.keys(presets).length + 1);
  presets[name] = getCurrentConfig();
  savePresetsToStorage();
  renderPresetList();
  input.value = '';
});
document.getElementById('presetNameInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('presetSaveBtn').click();
});
renderPresetList();

document.getElementById('addSceneLinkBtn').addEventListener('click', function () {
  const name = window.prompt('프리셋 이름을 입력하세요 (예: 기본 프리셋 3):');
  if (name === null || !name.trim()) return;
  const url = window.prompt('연결할 배경 페이지 파일명을 입력하세요 (예: index.html):', 'index.html');
  if (url === null) return;
  const trimmedUrl = url.trim();
  if (!/^[a-zA-Z0-9_-]+\.html$/.test(trimmedUrl)) {
    window.alert('같은 폴더의 html 파일명만 입력할 수 있어요 (예: index.html).');
    return;
  }
  const trimmedName = name.trim();
  if (presets[trimmedName] && !window.confirm('"' + trimmedName + '" 이름이 이미 있습니다. 덮어쓸까요?')) return;
  presets[trimmedName] = { sceneUrl: trimmedUrl };
  savePresetsToStorage();
  renderPresetList();
});

// ------------------------------------------------------------
// 공개 갤러리 - 적용/OBS 버튼은 집계 호출 + sceneUrl 이동 시 로딩 오버레이를 통해
// 응답을 기다린 뒤 이동한다(index.html/ski-resort.html/fireworks.html과 동일 패턴 -
// 곧바로 location.href를 바꾸면 집계 요청이 응답 전에 취소되는 문제가 있었다).
// ------------------------------------------------------------
function renderGallery(entries) {
  lastGalleryEntries = entries;
  const root = document.getElementById('galleryList');
  root.innerHTML = '';
  const keys = Object.keys(entries);
  if (keys.length === 0) {
    const empty = document.createElement('p');
    empty.className = 'preset-empty';
    empty.textContent = '아직 게시된 프리셋이 없습니다';
    root.appendChild(empty);
    return;
  }
  keys.sort(function (a, b) { return (entries[b].createdAt || 0) - (entries[a].createdAt || 0); });
  keys.forEach(function (key) {
    const entry = entries[key];
    if (!entry || !entry.config) return;

    const row = document.createElement('div');
    row.className = 'preset-row';

    const label = document.createElement('span');
    label.className = 'preset-name';
    label.textContent = entry.name || '(이름 없음)';
    if (isAdminForGallery) {
      label.title = (entry.name || '') + ' (더블클릭하여 이름 변경)';
      label.style.cursor = 'pointer';
      label.addEventListener('dblclick', function () {
        const newName = window.prompt('새 이름을 입력하세요:', entry.name || '');
        if (newName === null) return;
        const trimmed = newName.trim();
        if (!trimmed || trimmed === entry.name) return;
        updatePresetFn({ id: key, name: trimmed, config: entry.config }).catch(function (err) {
          console.error('갤러리 이름 변경 실패:', err);
          window.alert('이름 변경에 실패했습니다. 잠시 후 다시 시도해주세요.');
        });
      });
    } else {
      label.title = entry.name || '';
    }
    row.appendChild(label);

    const applyBtn = document.createElement('button');
    applyBtn.className = 'preset-btn';
    applyBtn.type = 'button';
    applyBtn.textContent = '적용';
    applyBtn.addEventListener('click', function () {
      const statsDone = incrementPresetApplyCountFn({ presetId: key }).catch(function (err) { console.error('적용 횟수 집계 실패:', err); }); // 통계용, 실패해도 실제 적용은 막지 않음
      if (entry.config.sceneUrl) {
        const sceneUrl = entry.config.sceneUrl;
        const overlay = document.getElementById('sceneApplyOverlay');
        if (overlay) overlay.hidden = false;
        let navigated = false;
        function goToScene() {
          if (navigated) return;
          navigated = true;
          window.location.href = sceneUrl;
        }
        statsDone.then(goToScene);
        setTimeout(goToScene, 5000);
        return;
      }
      applyConfig(entry.config);
    });
    row.appendChild(applyBtn);

    const obsBtn = document.createElement('button');
    obsBtn.className = 'preset-btn';
    obsBtn.type = 'button';
    obsBtn.textContent = 'OBS';
    obsBtn.title = 'OBS 브라우저 소스용 링크 복사 - 추가하자마자 패널·상단바 없이 꽉 찬 화면으로 시작';
    obsBtn.addEventListener('click', function () {
      incrementPresetObsLinkCountFn({ presetId: key }).catch(function (err) { console.error('OBS 링크 집계 실패:', err); }); // 통계용, 실패해도 실제 복사는 막지 않음
      const dir = location.pathname.replace(/[^/]*$/, '');
      const url = entry.config.sceneUrl
        ? location.origin + dir + entry.config.sceneUrl + '?obs=1'
        : location.origin + dir + 'index.html?preset=' + encodePreset(entry.config) + '&obs=1';
      copyToClipboard(url).then(function () {
        obsBtn.textContent = '복사됨!';
        setTimeout(function () { obsBtn.textContent = 'OBS'; }, 1500);
      }).catch(function () {
        window.prompt('아래 URL을 복사하세요:', url);
      });
    });
    row.appendChild(obsBtn);

    if (isAdminForGallery) {
      const delBtn = document.createElement('button');
      delBtn.className = 'preset-btn preset-btn--del';
      delBtn.type = 'button';
      delBtn.textContent = '✕';
      delBtn.title = '게시물 삭제';
      delBtn.addEventListener('click', function () {
        if (!window.confirm('"' + (entry.name || '') + '" 게시물을 삭제할까요?')) return;
        deletePresetFn({ id: key }).catch(function (err) {
          console.error('갤러리 삭제 실패:', err);
          window.alert('삭제에 실패했습니다. 잠시 후 다시 시도해주세요.');
        });
      });
      row.appendChild(delBtn);
    }

    root.appendChild(row);
  });
}
let lastGalleryEntries = null;
onValue(galleryRef, function (snapshot) {
  renderGallery(snapshot.val() || {});
}, function (err) {
  console.error('presetGallery 읽기 실패:', err);
  const root = document.getElementById('galleryList');
  root.innerHTML = '';
  const errEl = document.createElement('p');
  errEl.className = 'preset-empty';
  errEl.textContent = '갤러리를 불러올 수 없습니다 (Firebase 규칙 확인 필요)';
  root.appendChild(errEl);
});

// ------------------------------------------------------------
// 계정 상태 - 익명/Google 로그인 (다른 배경 페이지들과 동일한 세션을 공유)
// ------------------------------------------------------------
const authStatusEl = document.getElementById('authStatus');
const authBtnEl = document.getElementById('authBtn');

function renderGalleryOwnership() {
  if (lastGalleryEntries) renderGallery(lastGalleryEntries);
}

function updateAuthUI(detail) {
  isAdminForGallery = !!(detail && detail.isAdmin);
  authBtnEl.disabled = false;
  if (detail && detail.isRealAccount) {
    authStatusEl.textContent = isAdminForGallery ? '로그인됨 (관리자)' : '로그인됨';
    authBtnEl.textContent = '로그아웃';
  } else {
    authStatusEl.textContent = '익명 사용자';
    authBtnEl.textContent = 'Google 로그인';
  }
  document.getElementById('addSceneLinkBtn').style.display = isAdminForGallery ? '' : 'none';
  document.getElementById('localPresetSection').style.display = isAdminForGallery ? '' : 'none';
  renderPresetList();
  renderGalleryOwnership();
}

authBtnEl.addEventListener('click', function () {
  if (firebaseAuthApi.isRealAccount()) firebaseAuthApi.signOut();
  else firebaseAuthApi.signIn();
});

onAuthStateChanged(auth, async function (user) {
  currentUser = user;
  if (user && !user.isAnonymous) {
    try {
      const result = await whoAmIFn();
      isAdminCached = !!(result.data && result.data.isAdmin);
    } catch (err) {
      console.error('관리자 여부 확인 실패:', err);
      isAdminCached = false;
    }
  } else {
    isAdminCached = false;
  }
  updateAuthUI({
    isRealAccount: !!(user && !user.isAnonymous),
    isAdmin: isAdminCached
  });
  if (!user) {
    signInAnonymously(auth).catch(function (err) { console.error('익명 로그인 실패:', err); });
  }
});

// ------------------------------------------------------------
// 리사이즈 - 16:9 고정, 레터박스 (다른 배경 페이지와 동일한 규칙)
// ------------------------------------------------------------
function fitCanvas() {
  const rect = appEl.getBoundingClientRect();
  const ww = rect.width, wh = rect.height;
  let w, h;
  if (ww / wh > FIXED_ASPECT) { h = wh; w = h * FIXED_ASPECT; }
  else { w = ww; h = w / FIXED_ASPECT; }
  const pr = Math.min(window.devicePixelRatio, 2);
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloomPass.resolution.set(w * pr, h * pr);
  hBlur.uniforms.h.value = TILT_SHIFT_BLURINESS / w;
  vBlur.uniforms.v.value = TILT_SHIFT_BLURINESS / h;
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ------------------------------------------------------------
// OBS 감지 - 실제 방송 캡처 중이면 devbar/패널을 숨겨서 화면을 깨끗하게 유지.

// 더블클릭으로 전체화면 전환/복귀 (다른 배경 페이지들과 동일한 동작)

canvas.addEventListener('dblclick', function () {

// ------------------------------------------------------------
// devbar 자동 스크롤 (넘칠 때만)
// ------------------------------------------------------------
(function setupDevbarMarquee() {
  const viewport = document.getElementById('devbarViewport');
  const track = document.getElementById('devbarTrack');
  if (!viewport || !track) return;
  function rebuild() {
    track.querySelectorAll('[data-clone]').forEach(function (el) { el.remove(); });
    track.classList.remove('auto-scroll');
    track.style.removeProperty('--devbar-duration');
    if (track.scrollWidth <= viewport.clientWidth) return;
    const originalWidth = track.scrollWidth;
    Array.prototype.slice.call(track.children).forEach(function (child) {
      const clone = child.cloneNode(true);
      clone.setAttribute('data-clone', 'true');
      clone.setAttribute('aria-hidden', 'true');
      clone.setAttribute('tabindex', '-1');
      track.appendChild(clone);
    });
    const duration = Math.max(8, originalWidth / 40);
    track.style.setProperty('--devbar-duration', duration + 's');
    track.classList.add('auto-scroll');
  }
  rebuild();
  let resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(rebuild, 200);
  });
})();

// ------------------------------------------------------------
// 패널 드래그 이동 (다른 배경 페이지들과 동일한 방식, 위치도 같은 키로 공유)
// ------------------------------------------------------------
const PANEL_POS_KEY = 'interior3dViewer.panelPos';
let panelDragging = false;
let panelDragOffsetX = 0, panelDragOffsetY = 0;

function clampPanelPos(left, top) {
  const rect = sidePanel.getBoundingClientRect();
  const appRect = appEl.getBoundingClientRect();
  const margin = 40;
  const maxLeft = appRect.width - margin;
  const maxTop = appRect.height - margin;
  const minLeft = margin - rect.width;
  return [
    Math.max(minLeft, Math.min(maxLeft, left)),
    Math.max(0, Math.min(maxTop, top))
  ];
}
function setPanelPosition(left, top) {
  sidePanel.style.left = left + 'px';
  sidePanel.style.top = top + 'px';
  sidePanel.style.right = 'auto';
  sidePanel.style.transform = 'none';
}
function stopPanelDrag() { panelDragging = false; }

panelHandle.addEventListener('pointerdown', function (e) {
  panelDragging = true;
  const rect = sidePanel.getBoundingClientRect();
  panelDragOffsetX = e.clientX - rect.left;
  panelDragOffsetY = e.clientY - rect.top;
  panelHandle.setPointerCapture(e.pointerId);
});
panelHandle.addEventListener('pointermove', function (e) {
  if (!panelDragging) return;
  if ((e.buttons & 1) === 0) { stopPanelDrag(); return; }
  const appRect = appEl.getBoundingClientRect();
  const clamped = clampPanelPos(e.clientX - panelDragOffsetX - appRect.left, e.clientY - panelDragOffsetY - appRect.top);
  setPanelPosition(clamped[0], clamped[1]);
});
panelHandle.addEventListener('pointerup', function (e) {
  if (!panelDragging) return;
  stopPanelDrag();
  const rect = sidePanel.getBoundingClientRect();
  const appRect = appEl.getBoundingClientRect();
  localStorage.setItem(PANEL_POS_KEY, JSON.stringify({ left: rect.left - appRect.left, top: rect.top - appRect.top }));
  try { panelHandle.releasePointerCapture(e.pointerId); } catch (err) {}
});
panelHandle.addEventListener('pointercancel', stopPanelDrag);

(function restorePanelPosition() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(PANEL_POS_KEY)); } catch (e) {}
  if (saved && typeof saved.left === 'number' && typeof saved.top === 'number') {
    const clamped = clampPanelPos(saved.left, saved.top);
    setPanelPosition(clamped[0], clamped[1]);
  }
})();

window.addEventListener('resize', function () {
  if (sidePanel.style.left && sidePanel.style.left !== 'auto') {
    const rect = sidePanel.getBoundingClientRect();
    const appRect = appEl.getBoundingClientRect();
    const clamped = clampPanelPos(rect.left - appRect.left, rect.top - appRect.top);
    setPanelPosition(clamped[0], clamped[1]);
  }
});

// ------------------------------------------------------------
// 렌더 루프 - 카메라는 완전히 고정. 운석 꼬리 흐름·불티·마을 반짝임만 매 프레임 갱신.
// ------------------------------------------------------------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  filmGrainPass.uniforms.uTime.value = t;
  updateCometFlow(dt, t);
  updateEmbers(dt);
  updateHeadGlow(t);
  updateTwinkle(t);
  composer.render();
}
animate();
</script>
