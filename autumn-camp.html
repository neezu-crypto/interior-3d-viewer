<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>스트리머 배경시장 · 가을 캠핑</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #04060a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
  }

  #app {
    position: relative;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #04060a;
  }

  #scene {
    display: block;
    touch-action: none;
  }

  #loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #04060a;
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    letter-spacing: 0.05em;
    transition: opacity 0.6s ease;
    z-index: 20;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }

  /* 다른 배경 페이지로 이동하는 프리셋("적용") 클릭 시 - 집계 요청이 서버에
     확실히 전송된 걸 확인한 뒤에만 페이지를 넘기기 위해, 그 사이 짧은 대기를
     사용자에게 보여준다(index.html과 동일한 스타일). */
  .scene-apply-overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(13,12,11,0.85);
    backdrop-filter: blur(3px);
    color: rgba(255,255,255,0.85);
    font-size: 13px; letter-spacing: 0.05em;
    z-index: 500;
  }
  .scene-apply-overlay[hidden] { display: none; }
  .scene-apply-spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: rgba(255,170,80,0.9);
    animation: scene-apply-spin 0.8s linear infinite;
  }
  @keyframes scene-apply-spin { to { transform: rotate(360deg); } }

  #sidePanel {
    position: absolute;
    top: 50%; right: 8%;
    transform: translateY(-50%);
    width: 300px;
    max-height: 92vh;
    overflow-y: auto;
    padding: 14px;
    border-radius: 14px;
    background: rgba(20, 18, 16, 0.55);
    backdrop-filter: blur(6px);
    color: rgba(255,255,255,0.88);
    font-size: 12px;
    z-index: 10;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.3) transparent;
  }
  #sidePanel::-webkit-scrollbar { width: 6px; }
  #sidePanel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 3px; }

  #panelHandle {
    cursor: grab;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: -14px -14px 8px -14px;
    padding: 7px 0;
    border-radius: 14px 14px 0 0;
    touch-action: none;
    transition: background 0.15s ease;
  }
  #panelHandle:hover { background: rgba(255,255,255,0.06); }
  #panelHandle:active { cursor: grabbing; }
  #panelHandle .panel-grip {
    width: 32px; height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.3);
  }

  .panel-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    margin: 0 0 12px;
  }

  .panel-hint {
    font-size: 11px;
    line-height: 1.5;
    color: rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 8px 10px;
    margin: 0 0 14px;
  }

  .auth-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 10px;
  }
  #authStatus {
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #authBtn {
    flex: none;
    padding: 5px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.9);
    font-size: 11px;
    cursor: pointer;
  }
  #authBtn:hover { background: rgba(255,255,255,0.14); }
  #authBtn:disabled { opacity: 0.5; cursor: default; }

  .preset-save-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  #presetNameInput {
    flex: 1;
    min-width: 0;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.92);
    font-size: 11px;
    outline: none;
  }
  #presetNameInput::placeholder { color: rgba(255,255,255,0.4); }
  #presetNameInput:focus { border-color: rgba(232, 166, 87, 0.6); }
  #presetSaveBtn {
    flex: none;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(232, 166, 87, 0.85);
    color: #1a1410;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  #presetSaveBtn:hover { background: #e8a657; }

  .panel-divider {
    height: 1px;
    background: rgba(255,255,255,0.14);
    margin: 12px 0;
  }

  .preset-empty {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    margin: 0;
  }
  .preset-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .preset-name {
    flex: 1;
    min-width: 0;
    font-size: 11.5px;
    color: rgba(255,255,255,0.88);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: text;
  }
  .preset-btn {
    flex: none;
    padding: 4px 9px;
    border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.85);
    font-size: 10.5px;
    cursor: pointer;
  }
  .preset-btn:hover { border-color: rgba(232, 166, 87, 0.6); }
  .preset-btn--del {
    color: rgba(255,255,255,0.5);
    padding: 4px 7px;
  }
  .preset-btn--del:hover { color: #e08a6a; border-color: rgba(224, 138, 106, 0.6); }

  /* devbar - 다른 제작 게임 홍보용 상단 바, 넘칠 때만 JS가 자동 스크롤 처리 */
  .devbar {
    flex: none;
    background: #0e1116;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: relative;
    z-index: 30;
  }
  .devbar-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 7px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .devbar-label {
    font-size: 11px;
    color: rgba(255,255,255,0.72);
    letter-spacing: 0.04em;
    flex-shrink: 0;
    white-space: nowrap;
    align-self: center;
  }
  .devbar-viewport { flex: 1 1 auto; min-width: 0; overflow: hidden; }
  .devbar-track { display: flex; gap: 8px; width: max-content; }
  .devbar-track.auto-scroll { animation: devbar-scroll var(--devbar-duration, 20s) linear infinite; }
  .devbar-track.auto-scroll:hover { animation-play-state: paused; }
  @keyframes devbar-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .devbar-track.auto-scroll { animation: none; }
    .devbar-viewport { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  }
  .dev-game-link {
    flex-shrink: 0;
    white-space: nowrap;
    padding: 6px 11px;
    border-radius: 6px;
    border: none;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.85);
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.12s ease;
  }
  .dev-game-link:hover { background: rgba(255,255,255,0.18); }
</style>
</head>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",

<script type="module">
// 가을 캠핑 배경 - 호숫가 단풍숲 캠프파이어. fireworks.html의 보일러플레이트(고정 카메라 +
// 16:9 레터박스 + 패널/갤러리 + 블룸/틸트시프트/비네트 후처리 파이프라인)를 그대로 가져오고,
// 씬 콘텐츠만 캠프파이어/단풍나무/호수(가짜반사)/낙엽 파티클로 새로 채웠다.
//
// 이 페이지는 (다른 페이지들과 달리) 최신 three.js를 ES 모듈로 불러온다 - r128(구식 스크립트
// 태그) 기반인 index.html/ski-resort.html과 달리, 새로 만드는 페이지부터 최신 방식으로 시작하기로
// 한 결정에 따른 것. 기존 페이지들은 그대로 두고 손대지 않는다.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ------------------------------------------------------------
// Firebase RTDB - 공개 프리셋 갤러리용. index.html/ski-resort.html과 동일한 프로젝트를 그대로
// 공유한다. 이 페이지는 전부 한 모듈 스크립트 안이라 window 커스텀 이벤트 브릿지 없이 그냥
// 직접 참조해서 쓴다(다른 두 페이지는 classic script와 module script가 분리돼 있어 그 브릿지가
// 필요했음).
// ------------------------------------------------------------
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-functions.js";
import {
  getAuth, GoogleAuthProvider, signInAnonymously, signInWithPopup, signInWithCredential,
  linkWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAZcjQPHphENs-Bb7IfdL2qTtOMhJrRP54",
  authDomain: "soop-stock-market.firebaseapp.com",
  databaseURL: "https://soop-stock-market-default-rtdb.firebaseio.com",
  projectId: "soop-stock-market",
  storageBucket: "soop-stock-market.firebasestorage.app",
  messagingSenderId: "997788925900",
  appId: "1:997788925900:web:b58db2970489bf18a3a769"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const galleryRef = ref(db, 'presetGallery');

// 08번 — devbar 게임 링크를 RTDB(devbarLinks, admin-center에서 관리)에서 가져와
// 하드코딩된 링크를 대체한다. 노드가 비어있거나 조회 실패 시 기존 하드코딩된
// data-game-id 링크를 그대로 둔다(devbar가 통째로 사라지는 사고 방지) — "방송국"
// 링크는 devbarLinks 대상이 아니라 항상 하드코딩 그대로 유지된다.
(async function () {
  const SELF_GAME_ID = 'backgroundMarket';
  try {
    const snap = await get(ref(db, 'devbarLinks'));
    const data = snap.val();
    if (!data) return;
    const links = Object.keys(data)
      .filter(function (id) { return id !== SELF_GAME_ID && data[id] && data[id].url; })
      .map(function (id) { return Object.assign({ id: id }, data[id]); })
      .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    if (!links.length) return;
    const track = document.getElementById('devbarTrack');
    if (!track) return;
    track.querySelectorAll('a[data-game-id]').forEach(function (el) { el.remove(); });
    links.forEach(function (link) {
      const a = document.createElement('a');
      a.className = 'dev-game-link';
      a.dataset.gameId = link.id;
      a.href = link.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = link.label;
      track.appendChild(a);
    });
    window.dispatchEvent(new Event('resize')); // 마퀴 재계산 트리거
  } catch (e) {
    console.error('devbar 링크 갱신 실패(기존 링크 유지):', e);
  }
})();
const functions = getFunctions(fbApp, 'us-central1');
const publishPresetFn = httpsCallable(functions, 'publishPreset');
const updatePresetFn = httpsCallable(functions, 'updatePreset');
const deletePresetFn = httpsCallable(functions, 'deletePreset');
const requestMergeTicketFn = httpsCallable(functions, 'requestPresetMergeTicket');
const claimMergeFn = httpsCallable(functions, 'claimPresetMerge');
const reportMergeFailureFn = httpsCallable(functions, 'reportPresetMergeFailure');
// 통합 관리 센터에서 배경시장 갤러리 통계(적용/OBS 링크 횟수)를 보여주기 위한
// 집계용 - 클릭한 사람에게 결과를 보여줄 필요가 없어 실패해도 조용히 무시한다
// (통계 갱신 실패로 실제 적용·복사 동작 자체를 막으면 안 됨).
const incrementPresetApplyCountFn = httpsCallable(functions, 'incrementPresetApplyCount');
const incrementPresetObsLinkCountFn = httpsCallable(functions, 'incrementPresetObsLinkCount');
// 09번/13번 — UI에서 게시/삭제 버튼을 보여줄지 판단하는 용도일 뿐(실제 권한은
// 항상 서버가 검증). adminCenter/adminUids는 .read:false라 클라이언트가 직접 못
// 읽으므로 whoAmI로 확인한 결과를 캐싱해서 쓴다.
const whoAmIFn = httpsCallable(functions, 'galleryWhoAmI');
let isAdminCached = false;
const auth = getAuth(fbApp);

let currentUser = null;
const firebaseAuthApi = {
  isRealAccount: function () { return !!(currentUser && !currentUser.isAnonymous); },
  isAdmin: function () { return isAdminCached; },
  signIn: function () {
    const provider = new GoogleAuthProvider();
    function handleFail(err) {
      if (err && (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request')) return;
      console.error('Google 로그인 실패:', err);
      window.alert('Google 로그인에 실패했습니다. 잠시 후 다시 시도해주세요.');
    }
    const oldUidBeforeSwitch = currentUser ? currentUser.uid : null;
    function linkOrSwitch(ticket) {
      return linkWithPopup(currentUser, provider).catch(function (err) {
        if (err && (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request')) return;
        if (err && err.code === 'auth/credential-already-in-use') {
          const cred = GoogleAuthProvider.credentialFromError(err);
          if (cred) {
            return signInWithCredential(auth, cred).then(function () {
              if (!ticket) {
                return reportMergeFailureFn({ oldUidHint: oldUidBeforeSwitch, reason: 'no-ticket' }).catch(function (reportErr) {
                  console.error('실패 로그 기록도 실패함:', reportErr);
                });
              }
              return claimMergeFn({ ticket: ticket }).catch(function (claimErr) {
                console.error('프리셋 소유권 이전 실패 (서버에 실패 로그가 남았을 수 있음):', claimErr);
              });
            }).catch(handleFail);
          }
        }
        handleFail(err);
      });
    }
    if (currentUser && currentUser.isAnonymous) {
      return requestMergeTicketFn().then(function (res) {
        return linkOrSwitch(res.data && res.data.ticket);
      }).catch(function (err) {
        console.error('병합 티켓 발급 실패, 티켓 없이 로그인 진행:', err);
        return linkOrSwitch(null);
      });
    }
    return signInWithPopup(auth, provider).catch(handleFail);
  },
  signOut: function () { return signOut(auth); }
};

// ------------------------------------------------------------
// 기본 설정 - 방송 송출용 고정 16:9 (다른 배경 페이지들과 동일한 규칙)
// ------------------------------------------------------------
const FIXED_ASPECT = 16 / 9;
const FIXED_FOV = 50;

const canvas = document.getElementById('scene');
const loadingEl = document.getElementById('loading');
const sidePanel = document.getElementById('sidePanel');
const panelHandle = document.getElementById('panelHandle');

const VignetteShader = {
  uniforms: { tDiffuse: { value: null }, darkness: { value: 1.1 } },
  vertexShader:
    'varying vec2 vUv;' +
    'void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader:
    'precision mediump float;' +
    'uniform sampler2D tDiffuse; uniform float darkness; varying vec2 vUv;' +
    'void main() {' +
    '  vec4 texel = texture2D(tDiffuse, vUv);' +
    '  vec2 uv = vUv - 0.5;' +
    '  float vig = 1.0 - dot(uv, uv) * darkness;' +
    '  gl_FragColor = vec4(texel.rgb * clamp(vig, 0.0, 1.0), texel.a);' +
    '}'
};
const FilmGrainShader = {
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uAmount: { value: 0.02 } },
  vertexShader:
    'varying vec2 vUv;' +
    'void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader:
    'precision mediump float;' +
    'uniform sampler2D tDiffuse; uniform float uTime; uniform float uAmount; varying vec2 vUv;' +
    'float grainRand(vec2 co) { return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453); }' +
    'void main() {' +
    '  vec4 texel = texture2D(tDiffuse, vUv);' +
    '  float n = (grainRand(vUv * 1000.0 + uTime) - 0.5) * uAmount;' +
    '  gl_FragColor = vec4(texel.rgb + n, texel.a);' +
    '}'
};

const AUTUMN_PALETTE = [0x8c2f2f, 0xc9642b, 0xd9a441];
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function createAutumnTree(seed = 1) {
  const rand = mulberry32(seed * 9973 + 17);
  const group = new THREE.Group();

  const trunkHeight = 1.6 + rand() * 0.8;
  const trunkGeo = new THREE.CylinderGeometry(0.09, 0.16, trunkHeight, 6);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3324, roughness: 1 });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = trunkHeight / 2;
  group.add(trunk);

  const canopyCenterY = trunkHeight + 0.6;
  const lobeCount = 4 + Math.floor(rand() * 3); // 4~6개
  for (let i = 0; i < lobeCount; i++) {
    const lobeRadius = 0.55 + rand() * 0.45;
    const lobeGeo = new THREE.IcosahedronGeometry(lobeRadius, 0);
    const color = AUTUMN_PALETTE[Math.floor(rand() * AUTUMN_PALETTE.length)];
    const lobeMat = new THREE.MeshStandardMaterial({ color, roughness: 0.9, flatShading: true });
    const lobe = new THREE.Mesh(lobeGeo, lobeMat);
    const angle = rand() * Math.PI * 2;
    const dist = i === 0 ? 0 : rand() * 0.55;
    lobe.position.set(Math.cos(angle) * dist, canopyCenterY + (rand() - 0.3) * 0.6, Math.sin(angle) * dist);
    lobe.rotation.set(rand() * Math.PI, rand() * Math.PI, rand() * Math.PI);
    lobe.scale.setScalar(0.85 + rand() * 0.3);
    group.add(lobe);
  }

  const scale = 0.85 + rand() * 0.5;
  group.scale.setScalar(scale);
  group.rotation.y = rand() * Math.PI * 2;
  return group;
}

// ---- 캠프파이어 불꽃/연기 파티클 - 캔버스로 절차적 생성한 방사형 텍스처 + 커스텀 셰이더 ----
function createRadialTexture(stops) {
  const size = 64;
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = size;
  const ctx = cvs.getContext('2d');
  const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [offset, color] of stops) grad.addColorStop(offset, color);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(cvs);
  tex.needsUpdate = true;
  return tex;
}
const PARTICLE_VERT = `
  attribute float aSize;
  attribute float aAlpha;
  attribute vec3 aColor;
  varying float vAlpha;
  varying vec3 vColor;
  void main() {
    vAlpha = aAlpha;
    vColor = aColor;
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aSize * (320.0 / -mvPosition.z);
    gl_Position = projectionMatrix * mvPosition;
  }
`;
const PARTICLE_FRAG = `
  uniform sampler2D map;
  varying float vAlpha;
  varying vec3 vColor;
  void main() {
    vec4 tex = texture2D(map, gl_PointCoord);
    gl_FragColor = vec4(vColor * tex.rgb * 3.0, tex.a * vAlpha);
  }
`;
function createParticleSystem(count, texture, blending) {
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  const alphas = new Float32Array(count);
  const state = new Array(count).fill(null).map(() => ({ life: 0, maxLife: 0, active: false }));
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { map: { value: texture } },
    vertexShader: PARTICLE_VERT,
    fragmentShader: PARTICLE_FRAG,
    transparent: true, depthWrite: false, blending,
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  return { points, geo, positions, colors, sizes, alphas, state, count };
}
const flameTexture = createRadialTexture([
  [0, 'rgba(255,255,255,1)'],
  [0.35, 'rgba(255,200,120,0.9)'],
  [0.7, 'rgba(255,110,40,0.35)'],
  [1, 'rgba(255,80,20,0)'],
]);
const smokeTexture = createRadialTexture([
  [0, 'rgba(140,136,130,0.7)'],
  [0.5, 'rgba(110,108,104,0.35)'],
  [1, 'rgba(100,100,100,0)'],
]);
function createCampfireFire(origin, rand = Math.random) {
  const sys = createParticleSystem(40, flameTexture, THREE.AdditiveBlending);
  sys.points.position.copy(origin);
  function respawn(i) {
    const s = sys.state[i];
    s.life = 0;
    s.maxLife = 0.5 + rand() * 0.4;
    s.baseX = (rand() - 0.5) * 0.16;
    s.baseZ = (rand() - 0.5) * 0.16;
    s.vy = 1.1 + rand() * 0.9;
    s.wobble = rand() * Math.PI * 2;
    s.wobbleSpeed = 3 + rand() * 3;
    s.active = true;
  }
  for (let i = 0; i < sys.count; i++) respawn(i);
  function update(dt, t) {
    for (let i = 0; i < sys.count; i++) {
      const s = sys.state[i];
      s.life += dt;
      if (s.life >= s.maxLife) respawn(i);
      const p = s.life / s.maxLife;
      const y = 0.05 + s.vy * s.life;
      const sway = Math.sin(t * s.wobbleSpeed + s.wobble) * 0.05 * p;
      sys.positions[i * 3] = s.baseX + sway;
      sys.positions[i * 3 + 1] = y;
      sys.positions[i * 3 + 2] = s.baseZ + sway * 0.6;
      sys.sizes[i] = 0.38 * (1 - p * 0.7);
      sys.alphas[i] = p < 0.15 ? p / 0.15 : 1 - (p - 0.15) / 0.85;
      const g = 0.95 - p * 0.65;
      const b = 0.75 - p * 0.7;
      sys.colors[i * 3] = 1.0; sys.colors[i * 3 + 1] = Math.max(g, 0.08); sys.colors[i * 3 + 2] = Math.max(b, 0.03);
    }
    sys.geo.attributes.position.needsUpdate = true;
    sys.geo.attributes.aSize.needsUpdate = true;
    sys.geo.attributes.aAlpha.needsUpdate = true;
    sys.geo.attributes.aColor.needsUpdate = true;
  }
  return { points: sys.points, update };
}
function createCampfireSmoke(origin, rand = Math.random) {
  const sys = createParticleSystem(18, smokeTexture, THREE.NormalBlending);
  sys.points.position.copy(origin);
  let spawnTimer = 0;
  function respawn(i) {
    const s = sys.state[i];
    s.life = 0;
    s.maxLife = 2.6 + rand() * 1.6;
    s.baseX = (rand() - 0.5) * 0.12;
    s.baseZ = (rand() - 0.5) * 0.12;
    s.vy = 0.28 + rand() * 0.18;
    s.windX = 0.06 + rand() * 0.08;
    s.windZ = (rand() - 0.5) * 0.05;
    s.active = true;
  }
  for (let i = 0; i < sys.count; i++) { sys.state[i].active = false; sys.alphas[i] = 0; }
  function update(dt) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnTimer = 0.22 + rand() * 0.15;
      const idle = sys.state.findIndex((s) => !s.active);
      if (idle !== -1) respawn(idle);
    }
    for (let i = 0; i < sys.count; i++) {
      const s = sys.state[i];
      if (!s.active) continue;
      s.life += dt;
      if (s.life >= s.maxLife) { s.active = false; sys.alphas[i] = 0; continue; }
      const p = s.life / s.maxLife;
      sys.positions[i * 3] = s.baseX + s.windX * s.life;
      sys.positions[i * 3 + 1] = 0.55 + s.vy * s.life;
      sys.positions[i * 3 + 2] = s.baseZ + s.windZ * s.life;
      sys.sizes[i] = 0.3 + p * 1.3;
      const fadeIn = Math.min(p / 0.15, 1);
      const fadeOut = 1 - Math.max((p - 0.4) / 0.6, 0);
      sys.alphas[i] = fadeIn * fadeOut * 0.32;
      sys.colors[i * 3] = 0.55; sys.colors[i * 3 + 1] = 0.53; sys.colors[i * 3 + 2] = 0.5;
    }
    sys.geo.attributes.position.needsUpdate = true;
    sys.geo.attributes.aSize.needsUpdate = true;
    sys.geo.attributes.aAlpha.needsUpdate = true;
    sys.geo.attributes.aColor.needsUpdate = true;
  }
  return { points: sys.points, update };
}

function cloneWithMaterials(obj) {
  const clone = obj.clone(true);
  clone.traverse((o) => {
    if (o.isMesh) o.material = Array.isArray(o.material) ? o.material.map((m) => m.clone()) : o.material.clone();
  });
  return clone;
}
function dimAsReflection(obj) {
  obj.traverse((o) => {
    if (o.isMesh) {
      o.material.transparent = true;
      o.material.opacity = 0.32;
      o.material.depthWrite = false;
    }
  });
}

// ---- 낙엽 파티클 (InstancedMesh, 실제 텀블링 회전) ----
// 참고: InstancedMesh + vertexColors/instanceColor 조합이 검게 렌더되는 문제를
// 격리 테스트로 확인함(순수 MeshBasicMaterial.color는 정상). 그래서 색상별로
// 별도 InstancedMesh 3개를 두는 방식으로 우회.
const LEAF_COLORS = [0x8c2f2f, 0xc9642b, 0xd9a441];
function createLeafColorGroup(color, count) {
  const geo = new THREE.PlaneGeometry(0.14, 0.18);
  const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 0.92 });
  const mesh = new THREE.InstancedMesh(geo, mat, count);
  mesh.frustumCulled = false;
  const SPAN = 9;
  const state = [];
  for (let i = 0; i < count; i++) {
    state.push({
      x: (Math.random() - 0.5) * SPAN * 2,
      z: -2 - Math.random() * 9,
      y: Math.random() * 7,
      fallSpeed: 0.35 + Math.random() * 0.35,
      swayPhase: Math.random() * Math.PI * 2,
      swaySpeed: 0.6 + Math.random() * 0.6,
      swayAmp: 0.5 + Math.random() * 0.7,
      rotAxis: new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize(),
      rotSpeed: 0.8 + Math.random() * 1.6,
      rotAngle: Math.random() * Math.PI * 2,
    });
  }
  const dummy = new THREE.Object3D();
  function update(dt, t) {
    for (let i = 0; i < count; i++) {
      const s = state[i];
      s.y -= s.fallSpeed * dt;
      if (s.y < 0) { s.y = 6.5 + Math.random() * 1.5; s.x = (Math.random() - 0.5) * SPAN * 2; s.z = -2 - Math.random() * 9; }
      s.rotAngle += s.rotSpeed * dt;
      const sway = Math.sin(t * s.swaySpeed + s.swayPhase) * s.swayAmp;
      dummy.position.set(s.x + sway, s.y, s.z);
      dummy.quaternion.setFromAxisAngle(s.rotAxis, s.rotAngle);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
  }
  return { mesh, update };
}
function createFallingLeaves(totalCount = 48) {
  const perGroup = Math.ceil(totalCount / LEAF_COLORS.length);
  const groups = LEAF_COLORS.map((c) => createLeafColorGroup(c, perGroup));
  return {
    meshes: groups.map((g) => g.mesh),
    update(dt, t) { for (const g of groups) g.update(dt, t); },
  };
}
const fallingLeaves = createFallingLeaves(48);
for (const m of fallingLeaves.meshes) scene.add(m);

// 후처리 - RenderPass + 블룸 + 틸트시프트 + 비네트 + 필름그레인.

// 하늘 돔이 화면 넓은 면적을 차지해서 threshold를 낮게 두면 하늘 전체가 블룸에 걸려
// 뿌옇게 뜬다(실제로 0.35에서 이 문제 발생 확인) - 캠프파이어처럼 정말 밝은 지점만
// 블룸이 걸리도록 threshold를 0.62까지 올렸다.
const bloomPass = new UnrealBloomPass(new THREE.Vector2(1280, 720), 1.0, 0.5, 0.62);
composer.addPass(bloomPass);

// 틸트시프트 블러 - ski-resort.html/fireworks.html과 동일한 기법(vUv.y 기반 가짜 심도)
const TiltShiftShader = {
  uniforms: { tDiffuse: { value: null }, h: { value: 1 / 512 }, v: { value: 1 / 512 }, r: { value: 0.5 } },
  vertexShader:
    'varying vec2 vUv;' +
    'void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShaderH:
    'uniform sampler2D tDiffuse; uniform float h; uniform float r; varying vec2 vUv;' +
    'void main() {' +
    '  vec4 sum = vec4(0.0);' +
    '  float hh = h * abs(r - vUv.y);' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x - 4.0*hh, vUv.y)) * 0.051;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x - 3.0*hh, vUv.y)) * 0.0918;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x - 2.0*hh, vUv.y)) * 0.12245;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x - 1.0*hh, vUv.y)) * 0.1531;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y)) * 0.1633;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x + 1.0*hh, vUv.y)) * 0.1531;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x + 2.0*hh, vUv.y)) * 0.12245;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x + 3.0*hh, vUv.y)) * 0.0918;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x + 4.0*hh, vUv.y)) * 0.051;' +
    '  gl_FragColor = sum;' +
    '}',
  fragmentShaderV:
    'uniform sampler2D tDiffuse; uniform float v; uniform float r; varying vec2 vUv;' +
    'void main() {' +
    '  vec4 sum = vec4(0.0);' +
    '  float vv = v * abs(r - vUv.y);' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y - 4.0*vv)) * 0.051;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y - 3.0*vv)) * 0.0918;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y - 2.0*vv)) * 0.12245;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y - 1.0*vv)) * 0.1531;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y)) * 0.1633;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y + 1.0*vv)) * 0.1531;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y + 2.0*vv)) * 0.12245;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y + 3.0*vv)) * 0.0918;' +
    '  sum += texture2D(tDiffuse, vec2(vUv.x, vUv.y + 4.0*vv)) * 0.051;' +
    '  gl_FragColor = sum;' +
    '}'
};
const hBlur = new ShaderPass({
  uniforms: THREE.UniformsUtils.clone(TiltShiftShader.uniforms),
  vertexShader: TiltShiftShader.vertexShader,
  fragmentShader: TiltShiftShader.fragmentShaderH
});
const vBlur = new ShaderPass({
  uniforms: THREE.UniformsUtils.clone(TiltShiftShader.uniforms),
  vertexShader: TiltShiftShader.vertexShader,
  fragmentShader: TiltShiftShader.fragmentShaderV
});
const TILT_SHIFT_BLURINESS = 4.8;
// 캠프파이어+호수 라인이 화면 중하단에 오는 구도라 포커스 띠를 화면 중앙보다 살짝 아래로.
const TILT_SHIFT_FOCUS_R = 0.42;
hBlur.uniforms.h.value = TILT_SHIFT_BLURINESS / 1280;
vBlur.uniforms.v.value = TILT_SHIFT_BLURINESS / 720;
hBlur.uniforms.r.value = vBlur.uniforms.r.value = TILT_SHIFT_FOCUS_R;
composer.addPass(hBlur);
composer.addPass(vBlur);

const vignettePass = new ShaderPass(VignetteShader);
composer.addPass(vignettePass);
const filmGrainPass = new ShaderPass(FilmGrainShader);
filmGrainPass.uniforms.uAmount.value = 0.02;
filmGrainPass.enabled = false; // 필름 그레인(노이즈) 효과 끔 - 다시 켜려면 이 줄만 지우면 됨
composer.addPass(filmGrainPass);
composer.addPass(new OutputPass());

// ------------------------------------------------------------
// 프리셋 - 이 페이지는 조정 가능한 설정이 없어서, "저장"은 이 가을 캠핑 페이지로
// 연결되는 링크(sceneUrl)를 이름 붙여 즐겨찾기해두는 것과 같다. index.html/ski-resort.html/
// fireworks.html의 프리셋과 로컬 저장소를 공유해서 오가며 관리할 수 있게 한다.
// ------------------------------------------------------------
const PRESETS_KEY = 'interior3dViewer.presets';
let presets = {};
try {
  presets = JSON.parse(localStorage.getItem(PRESETS_KEY)) || {};
} catch (e) { presets = {}; }

function getCurrentConfig() {
  return { sceneUrl: 'autumn-camp.html' };
}
function encodePreset(cfg) {
  return btoa(unescape(encodeURIComponent(JSON.stringify(cfg))));
}
function applyConfig(cfg) {
  if (cfg.sceneUrl) {
    window.location.href = cfg.sceneUrl;
    return;
  }
  window.location.href = 'index.html?preset=' + encodePreset(cfg);
}
function savePresetsToStorage() {
  localStorage.setItem(PRESETS_KEY, JSON.stringify(presets));
}
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function (resolve, reject) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      resolve();
    } catch (e) { reject(e); }
  });
}

let isAdminForGallery = false;

function renderPresetList() {
  const root = document.getElementById('presetList');
  root.innerHTML = '';
  const names = Object.keys(presets);
  if (names.length === 0) {
    const empty = document.createElement('p');
    empty.className = 'preset-empty';
    empty.textContent = '저장된 프리셋이 없습니다';
    root.appendChild(empty);
    return;
  }
  names.forEach(function (name) {
    const row = document.createElement('div');
    row.className = 'preset-row';

    const label = document.createElement('span');
    label.className = 'preset-name';
    label.textContent = name;
    label.title = name + ' (더블클릭하여 이름 변경)';
    label.addEventListener('dblclick', function () {
      const newName = window.prompt('새 이름을 입력하세요:', name);
      if (newName === null) return;
      const trimmed = newName.trim();
      if (!trimmed || trimmed === name) return;
      if (presets[trimmed] && !window.confirm('"' + trimmed + '" 이름이 이미 있습니다. 덮어쓸까요?')) return;
      const cfg = presets[name];
      delete presets[name];
      presets[trimmed] = cfg;
      savePresetsToStorage();
      renderPresetList();
    });
    row.appendChild(label);

    const applyBtn = document.createElement('button');
    applyBtn.className = 'preset-btn';
    applyBtn.type = 'button';
    applyBtn.textContent = '적용';
    applyBtn.addEventListener('click', function () { applyConfig(presets[name]); });
    row.appendChild(applyBtn);

    const shareBtn = document.createElement('button');
    shareBtn.className = 'preset-btn';
    shareBtn.type = 'button';
    shareBtn.textContent = '공유';
    shareBtn.title = '이 프리셋의 공유 링크를 클립보드에 복사';
    shareBtn.addEventListener('click', function () {
      const url = location.origin + location.pathname.replace(/[^/]*$/, '') + 'index.html?preset=' + encodePreset(presets[name]);
      copyToClipboard(url).then(function () {
        shareBtn.textContent = '복사됨!';
        setTimeout(function () { shareBtn.textContent = '공유'; }, 1500);
      }).catch(function () {
        window.prompt('아래 URL을 복사하세요:', url);
      });
    });
    row.appendChild(shareBtn);

    // OBS 링크 - 공유 링크(항상 index.html 경유)와 달리, sceneUrl 프리셋이면 이
    // 가을 캠핑 페이지로 바로 연결하고 ?obs=1을 붙여서 OBS 브라우저 소스로 추가하자마자
    // (window.obsstudio 주입을 기다릴 필요 없이) 패널·상단바 없이 꽉 찬 화면으로
    // 바로 시작하게 한다. 방 설정 프리셋이면 index.html로 보내되 마찬가지로 ?obs=1을 붙인다.
    const obsBtn = document.createElement('button');
    obsBtn.className = 'preset-btn';
    obsBtn.type = 'button';
    obsBtn.textContent = 'OBS';
    obsBtn.title = 'OBS 브라우저 소스용 링크 복사 - 추가하자마자 패널·상단바 없이 꽉 찬 화면으로 시작';
    obsBtn.addEventListener('click', function () {
      const dir = location.pathname.replace(/[^/]*$/, '');
      const url = presets[name].sceneUrl
        ? location.origin + dir + presets[name].sceneUrl + '?obs=1'
        : location.origin + dir + 'index.html?preset=' + encodePreset(presets[name]) + '&obs=1';
      copyToClipboard(url).then(function () {
        obsBtn.textContent = '복사됨!';
        setTimeout(function () { obsBtn.textContent = 'OBS'; }, 1500);
      }).catch(function () {
        window.prompt('아래 URL을 복사하세요:', url);
      });
    });
    row.appendChild(obsBtn);

    if (isAdminForGallery) {
      const publishBtn = document.createElement('button');
      publishBtn.className = 'preset-btn';
      publishBtn.type = 'button';
      publishBtn.textContent = '게시';
      publishBtn.title = '모두가 볼 수 있는 공개 갤러리에 올리기';
      publishBtn.addEventListener('click', function () {
        publishPresetFn({ name: name, config: presets[name] }).then(function () {
          publishBtn.textContent = '게시됨!';
          setTimeout(function () { publishBtn.textContent = '게시'; }, 1500);
        }).catch(function (err) {
          console.error('갤러리 게시 실패:', err);
          window.alert('갤러리 게시에 실패했습니다. 잠시 후 다시 시도해주세요.');
        });
      });
      row.appendChild(publishBtn);
    }

    const delBtn = document.createElement('button');
    delBtn.className = 'preset-btn preset-btn--del';
    delBtn.type = 'button';
    delBtn.textContent = '✕';
    delBtn.title = '삭제';
    delBtn.addEventListener('click', function () {
      delete presets[name];
      savePresetsToStorage();
      renderPresetList();
    });
    row.appendChild(delBtn);

    root.appendChild(row);
  });
}

document.getElementById('presetSaveBtn').addEventListener('click', function () {
  const input = document.getElementById('presetNameInput');
  let name = input.value.trim();
  if (!name) name = '프리셋 ' + (Object.keys(presets).length + 1);
  presets[name] = getCurrentConfig();
  savePresetsToStorage();
  renderPresetList();
  input.value = '';
});
document.getElementById('presetNameInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('presetSaveBtn').click();
});
renderPresetList();

// 계정 상태 - 익명/Google 로그인 (다른 배경 페이지들과 동일한 세션을 공유)
// ------------------------------------------------------------
const authStatusEl = document.getElementById('authStatus');
const authBtnEl = document.getElementById('authBtn');
let lastGalleryEntries = null;

function renderGalleryOwnership() {
  if (lastGalleryEntries) renderGallery(lastGalleryEntries);
}

function updateAuthUI(detail) {
  isAdminForGallery = !!(detail && detail.isAdmin);
  authBtnEl.disabled = false;
  if (detail && detail.isRealAccount) {
    authStatusEl.textContent = isAdminForGallery ? '로그인됨 (관리자)' : '로그인됨';
    authBtnEl.textContent = '로그아웃';
  } else {
    authStatusEl.textContent = '익명 사용자';
    authBtnEl.textContent = 'Google 로그인';
  }
  document.getElementById('addSceneLinkBtn').style.display = isAdminForGallery ? '' : 'none';
  // 일반 유저는 로컬에 프리셋을 저장/관리하는 세션 자체가 필요 없다 - 갤러리에
  // 이미 게시된 프리셋을 적용/OBS 링크 복사만 하면 된다. 관리자만 이 섹션으로
  // 새 프리셋을 만들고 게시할 수 있다.
  document.getElementById('localPresetSection').style.display = isAdminForGallery ? '' : 'none';
  renderPresetList();
  renderGalleryOwnership();
}

document.getElementById('addSceneLinkBtn').addEventListener('click', function () {
  const name = window.prompt('프리셋 이름을 입력하세요 (예: 기본 프리셋 3):');
  if (name === null || !name.trim()) return;
  const url = window.prompt('연결할 배경 페이지 파일명을 입력하세요 (예: index.html):', 'index.html');
  if (url === null) return;
  const trimmedUrl = url.trim();
  if (!/^[a-zA-Z0-9_-]+\.html$/.test(trimmedUrl)) {
    window.alert('같은 폴더의 html 파일명만 입력할 수 있어요 (예: index.html).');
    return;
  }
  const trimmedName = name.trim();
  if (presets[trimmedName] && !window.confirm('"' + trimmedName + '" 이름이 이미 있습니다. 덮어쓸까요?')) return;
  presets[trimmedName] = { sceneUrl: trimmedUrl };
  savePresetsToStorage();
  renderPresetList();
});

authBtnEl.addEventListener('click', function () {
  if (firebaseAuthApi.isRealAccount()) firebaseAuthApi.signOut();
  else firebaseAuthApi.signIn();
});

onAuthStateChanged(auth, async function (user) {
  currentUser = user;
  if (user && !user.isAnonymous) {
    try {
      const result = await whoAmIFn();
      isAdminCached = !!(result.data && result.data.isAdmin);
    } catch (err) {
      console.error('관리자 여부 확인 실패:', err);
      isAdminCached = false;
    }
  } else {
    isAdminCached = false;
  }
  updateAuthUI({
    user: user,
    isRealAccount: !!(user && !user.isAnonymous),
    isAdmin: isAdminCached
  });
  if (!user) {
    signInAnonymously(auth).catch(function (err) { console.error('익명 로그인 실패:', err); });
  }
});

document.addEventListener('keydown', function (e) {
  if (e.ctrlKey && e.key === 'Enter' && !firebaseAuthApi.isRealAccount()) {
    e.preventDefault();
    firebaseAuthApi.signIn();
  }
});

// 공개 갤러리
// ------------------------------------------------------------
function renderGallery(entries) {
  lastGalleryEntries = entries;
  const root = document.getElementById('galleryList');
  root.innerHTML = '';
  const keys = Object.keys(entries);
  if (keys.length === 0) {
    const empty = document.createElement('p');
    empty.className = 'preset-empty';
    empty.textContent = '아직 게시된 프리셋이 없습니다';
    root.appendChild(empty);
    return;
  }
  keys.sort(function (a, b) { return (entries[b].createdAt || 0) - (entries[a].createdAt || 0); });
  keys.forEach(function (key) {
    const entry = entries[key];
    if (!entry || !entry.config) return;

    const row = document.createElement('div');
    row.className = 'preset-row';

    const label = document.createElement('span');
    label.className = 'preset-name';
    label.textContent = entry.name || '(이름 없음)';
    // 이름 변경(더블클릭)은 관리자만 - 서버(updatePreset)도 requireAdmin으로
    // 검증하지만, 비관리자에겐 애초에 그런 조작이 가능한 것처럼 보이지 않게 한다.
    if (isAdminForGallery) {
      label.title = (entry.name || '') + ' (더블클릭하여 이름 변경)';
      label.style.cursor = 'pointer';
      label.addEventListener('dblclick', function () {
        const newName = window.prompt('새 이름을 입력하세요:', entry.name || '');
        if (newName === null) return;
        const trimmed = newName.trim();
        if (!trimmed || trimmed === entry.name) return;
        updatePresetFn({ id: key, name: trimmed, config: entry.config }).catch(function (err) {
          console.error('갤러리 이름 변경 실패:', err);
          window.alert('이름 변경에 실패했습니다. 잠시 후 다시 시도해주세요.');
        });
      });
    } else {
      label.title = entry.name || '';
    }
    row.appendChild(label);

    const applyBtn = document.createElement('button');
    applyBtn.className = 'preset-btn';
    applyBtn.type = 'button';
    applyBtn.textContent = '적용';
    applyBtn.addEventListener('click', function () {
      const statsDone = incrementPresetApplyCountFn({ presetId: key }).catch(function (err) { console.error('적용 횟수 집계 실패:', err); }); // 통계용, 실패해도 실제 적용은 막지 않음
      // 이 프리셋이 완전히 다른 배경 페이지(스키장·불꽃놀이 등)로 연결되는
      // sceneUrl 프리셋이면 곧바로 그 페이지로 이동한다. 다만 응답을 받기 전에
      // 페이지를 떠나면 브라우저가 방금 보낸 집계 요청을 취소해버리므로,
      // 로딩 오버레이를 띄운 채 집계 요청이 끝나거나(정상) 5초가 지나면(네트워크
      // 완전 단절 등 안전장치) 이동한다.
      if (entry.config.sceneUrl) {
        const sceneUrl = entry.config.sceneUrl;
        const overlay = document.getElementById('sceneApplyOverlay');
        if (overlay) overlay.hidden = false;
        let navigated = false;
        function goToScene() {
          if (navigated) return;
          navigated = true;
          window.location.href = sceneUrl;
        }
        statsDone.then(goToScene);
        setTimeout(goToScene, 5000);
        return;
      }
      applyConfig(entry.config);
    });
    row.appendChild(applyBtn);

    // OBS 링크 - sceneUrl 프리셋이면 그 배경 페이지로 바로, 방 설정 프리셋이면
    // index.html로 연결하고 둘 다 ?obs=1을 붙여서 OBS 브라우저 소스로 추가하자마자
    // (window.obsstudio 주입을 기다릴 필요 없이) 패널·상단바 없이 꽉 찬 화면으로 시작한다.
    const obsBtn = document.createElement('button');
    obsBtn.className = 'preset-btn';
    obsBtn.type = 'button';
    obsBtn.textContent = 'OBS';
    obsBtn.title = 'OBS 브라우저 소스용 링크 복사 - 추가하자마자 패널·상단바 없이 꽉 찬 화면으로 시작';
    obsBtn.addEventListener('click', function () {
      incrementPresetObsLinkCountFn({ presetId: key }).catch(function (err) { console.error('OBS 링크 집계 실패:', err); }); // 통계용, 실패해도 실제 복사는 막지 않음
      const dir = location.pathname.replace(/[^/]*$/, '');
      const url = entry.config.sceneUrl
        ? location.origin + dir + entry.config.sceneUrl + '?obs=1'
        : location.origin + dir + 'index.html?preset=' + encodePreset(entry.config) + '&obs=1';
      copyToClipboard(url).then(function () {
        obsBtn.textContent = '복사됨!';
        setTimeout(function () { obsBtn.textContent = 'OBS'; }, 1500);
      }).catch(function () {
        window.prompt('아래 URL을 복사하세요:', url);
      });
    });
    row.appendChild(obsBtn);

    if (isAdminForGallery) {
      const delBtn = document.createElement('button');
      delBtn.className = 'preset-btn preset-btn--del';
      delBtn.type = 'button';
      delBtn.textContent = '✕';
      delBtn.title = '게시물 삭제';
      delBtn.addEventListener('click', function () {
        if (!window.confirm('"' + (entry.name || '') + '" 게시물을 삭제할까요?')) return;
        deletePresetFn({ id: key }).catch(function (err) {
          console.error('갤러리 삭제 실패:', err);
          window.alert('삭제에 실패했습니다. 잠시 후 다시 시도해주세요.');
        });
      });
      row.appendChild(delBtn);
    }

    root.appendChild(row);
  });
}
onValue(galleryRef, function (snapshot) {
  renderGallery(snapshot.val() || {});
}, function (err) {
  console.error('presetGallery 읽기 실패:', err);
  const root = document.getElementById('galleryList');
  root.innerHTML = '';
  const errEl = document.createElement('p');
  errEl.className = 'preset-empty';
  errEl.textContent = '갤러리를 불러올 수 없습니다 (Firebase 규칙 확인 필요)';
  root.appendChild(errEl);
});

// ------------------------------------------------------------
// 리사이즈 - 16:9 고정, 레터박스 (다른 배경 페이지와 동일한 규칙)
// ------------------------------------------------------------
function fitCanvas() {
  const rect = appEl.getBoundingClientRect();
  const ww = rect.width, wh = rect.height;
  let w, h;
  if (ww / wh > FIXED_ASPECT) { h = wh; w = h * FIXED_ASPECT; }
  else { w = ww; h = w / FIXED_ASPECT; }
  const pr = Math.min(window.devicePixelRatio, 2);
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloomPass.resolution.set(w * pr, h * pr);
  hBlur.uniforms.h.value = TILT_SHIFT_BLURINESS / w;
  vBlur.uniforms.v.value = TILT_SHIFT_BLURINESS / h;
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ------------------------------------------------------------
// OBS 감지 - 실제 방송 캡처 중이면 devbar/패널을 숨겨서 화면을 깨끗하게 유지.
// URL에 ?obs=1이 있어도 동일하게 취급한다("OBS" 프리셋 링크가 붙이는 값 - window.obsstudio
// 주입 타이밍에 기대지 않고 로드 즉시 꽉 찬 화면으로 시작, 일반 브라우저 탭 미리보기도 가능).
// ------------------------------------------------------------
const inOBS = !!window.obsstudio || new URLSearchParams(location.search).get('obs') === '1';
if (inOBS) {
  sidePanel.style.display = 'none';
  document.getElementById('devbar').style.display = 'none';
  fitCanvas();
}

// ------------------------------------------------------------
// 더블클릭으로 전체화면 전환/복귀 (다른 배경 페이지들과 동일한 동작)
// ------------------------------------------------------------
canvas.addEventListener('dblclick', function () {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    document.documentElement.requestFullscreen().catch(function (err) {
      console.error('전체화면 전환 실패:', err);
    });
  }
});

const devbarEl = document.getElementById('devbar');
document.addEventListener('fullscreenchange', function () {
  if (inOBS) return;
  const fs = !!document.fullscreenElement;
  sidePanel.style.display = fs ? 'none' : '';
  devbarEl.style.display = fs ? 'none' : '';
  fitCanvas();
});

// ------------------------------------------------------------
// devbar 자동 스크롤 (넘칠 때만)
// ------------------------------------------------------------
(function setupDevbarMarquee() {
  const viewport = document.getElementById('devbarViewport');
  const track = document.getElementById('devbarTrack');
  if (!viewport || !track) return;
  function rebuild() {
    track.querySelectorAll('[data-clone]').forEach(function (el) { el.remove(); });
    track.classList.remove('auto-scroll');
    track.style.removeProperty('--devbar-duration');
    if (track.scrollWidth <= viewport.clientWidth) return;
    const originalWidth = track.scrollWidth;
    Array.prototype.slice.call(track.children).forEach(function (child) {
      const clone = child.cloneNode(true);
      clone.setAttribute('data-clone', 'true');
      clone.setAttribute('aria-hidden', 'true');
      clone.setAttribute('tabindex', '-1');
      track.appendChild(clone);
    });
    const duration = Math.max(8, originalWidth / 40);
    track.style.setProperty('--devbar-duration', duration + 's');
    track.classList.add('auto-scroll');
  }
  rebuild();
  let resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(rebuild, 200);
  });
})();

// ------------------------------------------------------------
// 패널 드래그 이동 (다른 배경 페이지들과 동일한 방식, 위치도 같은 키로 공유)
// ------------------------------------------------------------
const PANEL_POS_KEY = 'interior3dViewer.panelPos';
let panelDragging = false;
let panelDragOffsetX = 0, panelDragOffsetY = 0;

function clampPanelPos(left, top) {
  const rect = sidePanel.getBoundingClientRect();
  const appRect = appEl.getBoundingClientRect();
  const margin = 40;
  const maxLeft = appRect.width - margin;
  const maxTop = appRect.height - margin;
  const minLeft = margin - rect.width;
  return [
    Math.max(minLeft, Math.min(maxLeft, left)),
    Math.max(0, Math.min(maxTop, top))
  ];
}
function setPanelPosition(left, top) {
  sidePanel.style.left = left + 'px';
  sidePanel.style.top = top + 'px';
  sidePanel.style.right = 'auto';
  sidePanel.style.transform = 'none';
}
function stopPanelDrag() { panelDragging = false; }

panelHandle.addEventListener('pointerdown', function (e) {
  panelDragging = true;
  const rect = sidePanel.getBoundingClientRect();
  panelDragOffsetX = e.clientX - rect.left;
  panelDragOffsetY = e.clientY - rect.top;
  panelHandle.setPointerCapture(e.pointerId);
});
panelHandle.addEventListener('pointermove', function (e) {
  if (!panelDragging) return;
  if ((e.buttons & 1) === 0) { stopPanelDrag(); return; }
  const appRect = appEl.getBoundingClientRect();
  const clamped = clampPanelPos(e.clientX - panelDragOffsetX - appRect.left, e.clientY - panelDragOffsetY - appRect.top);
  setPanelPosition(clamped[0], clamped[1]);
});
panelHandle.addEventListener('pointerup', function (e) {
  if (!panelDragging) return;
  stopPanelDrag();
  const rect = sidePanel.getBoundingClientRect();
  const appRect = appEl.getBoundingClientRect();
  localStorage.setItem(PANEL_POS_KEY, JSON.stringify({ left: rect.left - appRect.left, top: rect.top - appRect.top }));
  try { panelHandle.releasePointerCapture(e.pointerId); } catch (err) {}
});
panelHandle.addEventListener('pointercancel', stopPanelDrag);

(function restorePanelPosition() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(PANEL_POS_KEY)); } catch (e) {}
  if (saved && typeof saved.left === 'number' && typeof saved.top === 'number') {
    const clamped = clampPanelPos(saved.left, saved.top);
    setPanelPosition(clamped[0], clamped[1]);
  }
})();

window.addEventListener('resize', function () {
  if (sidePanel.style.left && sidePanel.style.left !== 'auto') {
    const rect = sidePanel.getBoundingClientRect();
    const appRect = appEl.getBoundingClientRect();
    const clamped = clampPanelPos(rect.left - appRect.left, rect.top - appRect.top);
    setPanelPosition(clamped[0], clamped[1]);
  }
});

// ------------------------------------------------------------
// 렌더 루프 - 카메라 완전 고정, 캠프파이어 불꽃/연기/낙엽 파티클과 조명 flicker만 갱신
// ------------------------------------------------------------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;
  campfireFire.update(dt, t);
  campfireSmoke.update(dt);
  fallingLeaves.update(dt, t);
  // 캠프파이어 조명 flicker: 사인파(느린 숨쉬기) + 랜덤 노이즈(잔불 튀는 느낌) 조합
  const flicker = Math.sin(t * 6.0) * 0.12 + Math.sin(t * 17.3) * 0.06 + (Math.random() - 0.5) * 0.1;
  fireLight.intensity = FIRE_LIGHT_BASE_INTENSITY + flicker;
  composer.render();
}

loadingEl.classList.add('hidden');
animate();
</script>
